name: Dev Room apps

on:
  push:
    branches: [main, ccr-c1736103-c42su6]
    paths: ["app/**", "mobile/**", ".github/workflows/windows-app.yml"]
  workflow_dispatch:

# One publish at a time, so the release always holds one matching set of files.
concurrency:
  group: dev-room-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Install Tauri CLI
        working-directory: app
        run: npm install
      - name: Build portable exe
        working-directory: app
        env:
          DEVROOM_BUILD: ${{ github.run_number }}
          DEVROOM_COMMIT: ${{ github.sha }}
        run: npx tauri build --no-bundle
      - name: Collect
        shell: bash
        run: |
          mkdir out
          cp app/src-tauri/target/release/dev-room.exe out/DevRoom.exe
          cp app/ui/index.html out/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # The ubuntu runner ships the Android SDK (ANDROID_HOME); Gradle fetches any missing platform.
      - name: Sync web shell into the Android project
        working-directory: mobile
        run: |
          echo "window.APK_BUILD=${{ github.run_number }};" > www/build.js
          npm install
          npx cap sync android
      - name: Signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/devroom.keystore"
            echo "DEVROOM_KS_PATH=$RUNNER_TEMP/devroom.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 is not set; the APK is debug-signed and later builds cannot install over it."
          fi
      - name: Build APK
        working-directory: mobile/android
        env:
          DEVROOM_BUILD: ${{ github.run_number }}
          DEVROOM_KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          mkdir -p ../../out && cp app/build/outputs/apk/release/app-release.apk ../../out/DevRoom.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/

  publish:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dl
          merge-multiple: true
      - name: Version file for the in-app updaters
        run: |
          API=$(tr -dc '0-9' < app/api-version.txt)
          printf '{"build": %s, "api": %s, "apk": %s, "commit": "%s"}\n' "${{ github.run_number }}" "$API" "${{ github.run_number }}" "${{ github.sha }}" > dl/version.json
          ls -la dl && cat dl/version.json
      - name: Publish to the "dev-room-latest" pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-room-latest
          name: Dev Room (latest build)
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            - **Windows:** download DevRoom.exe and run it; no install needed.
            - **Android:** download DevRoom.apk and install it (allow "Install unknown apps" for your browser).
            Both apps update themselves from this release. index.html and version.json are for the in-app updaters.
            Built from ${{ github.ref_name }} at ${{ github.sha }}.
          files: |
            dl/DevRoom.exe
            dl/DevRoom.apk
            dl/index.html
            dl/version.json
