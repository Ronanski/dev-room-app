name: Windows app

on:
  push:
    branches: [main, ccr-c1736103-c42su6]
    paths: ["app/**", ".github/workflows/windows-app.yml"]
  workflow_dispatch:

# One publish at a time, so the release always holds one matching set of files.
concurrency:
  group: dev-room-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Install Tauri CLI
        working-directory: app
        run: npm install
      - name: Build portable exe
        working-directory: app
        env:
          DEVROOM_BUILD: ${{ github.run_number }}
          DEVROOM_COMMIT: ${{ github.sha }}
        run: npx tauri build --no-bundle
      - name: Rename
        shell: bash
        run: |
          cp app/src-tauri/target/release/dev-room.exe DevRoom.exe
          cp app/ui/index.html index.html
          API=$(tr -dc '0-9' < app/api-version.txt)
          printf '{"build": %s, "api": %s, "commit": "%s"}\n' "${{ github.run_number }}" "$API" "${{ github.sha }}" > version.json
          cat version.json
      - uses: actions/upload-artifact@v4
        with:
          name: DevRoom-windows
          path: |
            DevRoom.exe
            index.html
            version.json
      - name: Publish to the "dev-room-latest" pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-room-latest
          name: Dev Room (latest build)
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Portable Windows app. Download DevRoom.exe and run it; no install needed.
            The app updates itself from this release: index.html and version.json are for the in-app updater.
            Built from ${{ github.ref_name }} at ${{ github.sha }}.
          files: |
            DevRoom.exe
            index.html
            version.json
