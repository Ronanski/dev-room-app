[package]
name = "dev-room"
version = "0.1.0"
description = "Dev Room: live office view of your Claude Code sessions"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tiny_http = "0.12"
serde_json = "1"
local-ip-address = "0.6"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand = "0.8"
ureq = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
