<!doctype html>
<html lang="fil">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2a201a">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">
<title>Dev Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&family=Pixelify+Sans:wght@500;700&display=swap">
<style>
/* Layout: the café-office is a game window on the left, the operator sidebar on the right; under 820px it folds into a 3-tab phone app */
:root{
  --bg:#efe7da; --panel:#f8f3ea; --ink:#2a201a; --muted:#6e5f52; --line:#dccfbd; --accent:#6b4a35; --chip:#e8dece;
  --work:#5f7d4e; --need:#b24a32; --idle:#a67c2e; --sleep:#6c6a80; --done:#4f6f7a; --fail:#8a3a30;
  --frame:#2a201a;
  --f-display:"Pixelify Sans","Courier New",monospace;
  --f-body:"Atkinson Hyperlegible",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1c1613; --panel:#26201b; --ink:#efe6d8; --muted:#a99886; --line:#3a2f27; --accent:#c9a27e; --chip:#2f2721;
  --work:#8fae7a; --need:#e07a5f; --idle:#d2a75a; --sleep:#a4a2c0; --done:#87aab6; --fail:#d07060; --frame:#0e0b09; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c1613; --panel:#26201b; --ink:#efe6d8; --muted:#a99886; --line:#3a2f27; --accent:#c9a27e; --chip:#2f2721;
  --work:#8fae7a; --need:#e07a5f; --idle:#d2a75a; --sleep:#a4a2c0; --done:#87aab6; --fail:#d07060; --frame:#0e0b09; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

.stage{max-width:none;margin:0}
.stage[data-device="desktop"] .app{height:calc(100dvh - 16px);display:flex;flex-direction:column}
.app:fullscreen{height:100vh!important;padding:10px;box-sizing:border-box}
.app.focus .top,.app.focus .conn,.app.focus .updbar,.app.focus .dockwrap,.app.focus .legend,.app.focus .rule,.app.focus .tabs,.app.focus .statusbar{display:none!important}
.app.focus{position:fixed;inset:0;z-index:50;height:100%!important;padding:6px;box-sizing:border-box;background:var(--bg)}
.app.focus .body{grid-template-rows:minmax(0,1fr);grid-template-areas:"office chat";height:100%}
.app.focus .pane[data-pane="office"]{display:flex!important;height:100%}
.app.focus .mapwrap{height:100%;flex:1}
.app{container-type:inline-size;container-name:app;position:relative;background:var(--bg)}
.statusbar{display:none}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:8px;flex:none}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:28px;height:28px;flex:none;background:
  linear-gradient(var(--accent),var(--accent)) 5px 10px/15px 13px no-repeat,
  linear-gradient(var(--accent),var(--accent)) 20px 13px/4px 6px no-repeat,
  linear-gradient(var(--line),var(--line)) 8px 2px/2px 6px no-repeat,
  linear-gradient(var(--line),var(--line)) 13px 3px/2px 5px no-repeat,
  linear-gradient(var(--ink),var(--ink)) 3px 24px/20px 2px no-repeat}
h1{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1;margin:0;letter-spacing:.5px}
.sub{margin:3px 0 0;color:var(--muted);font-size:12px}
.clock{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.counts{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.count{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--chip);font-size:12.5px;font-variant-numeric:tabular-nums}
.count b{font-family:var(--f-mono)}
.count.need.on{background:var(--need);color:#fff}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.controls{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);padding:6px 12px;border-radius:8px;font-size:13px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:6px 12px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.body{display:grid;grid-template-columns:minmax(0,1fr) clamp(300px,28%,380px);grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"office chat" "dock dock";gap:10px;flex:1;min-height:0}
.app.nochat .body{grid-template-columns:minmax(0,1fr) 0}
.app.nochat .pane[data-pane="chat"]{display:none}
.pane[data-pane="office"]{display:flex;flex-direction:column;min-height:0}
.pane[data-pane="office"]{grid-area:office;min-width:0}
.pane[data-pane="chat"]{grid-area:chat;min-width:0;position:relative;min-height:540px}
.dockwrap{grid-area:dock;min-width:0}

.mapwrap{position:relative;border-radius:10px;overflow:hidden;border:3px solid var(--frame);background:#1c140f;flex:1;min-height:320px}
#map{display:block;position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;cursor:grab;touch-action:none}
#map.drag{cursor:grabbing}
.zoom{position:absolute;top:8px;right:8px;display:flex;gap:4px;z-index:3}
.zoom button{border:1px solid #2b211b;background:#f7f0e3;color:#2b211b;border-radius:6px;font-size:13px;min-width:30px;height:30px;padding:0 8px;font-weight:700}
.zoom button:hover{background:#efe2c4}
.overlay{position:absolute;inset:0;pointer-events:none}
.ent{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:2px;width:0}
.bub{font-size:calc(9px * var(--zs,1) * var(--bs,1.3));line-height:1.25;background:#f7f0e3;color:#2b211b;border:1.5px solid #2b211b;padding:1px 5px;border-radius:5px;width:max-content;max-width:calc(130px * var(--bs,1.3));text-align:center;white-space:normal}
.bub:empty{display:none}
.bub{position:relative}
.ent.lifted .bub::after{content:"";position:absolute;left:50%;top:100%;width:1.5px;height:var(--lift,0);background:rgba(43,33,27,.55);transform:translateX(-50%)}
.bub.need{background:#b24a32;border-color:#5a2216;color:#fff;font-weight:700;animation:bob .9s ease-in-out infinite}
.bub.sleep{background:#e3ddd2;color:#5b5348}
.bub.done{background:#dfe6cf}
.bub.fail{background:#efd2c8}
.bub.npc{background:#efe2c4}
.bub.talk{background:#fffaf0}
a.btn{text-decoration:none;display:inline-block;color:inherit}
a.btn.primary{color:var(--panel)}
.updbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;padding:6px 10px;border-radius:10px;margin-bottom:8px;background:color-mix(in srgb,var(--work) 14%,var(--panel));border:1px solid color-mix(in srgb,var(--work) 45%,transparent);flex:none}
.bub.boss{background:#2b211b;color:#f7f0e3}
.tag{font-family:var(--f-mono);font-size:calc(8px * var(--zs,1) * var(--bs,1.3));font-weight:600;background:rgba(43,33,27,.82);color:#f7f0e3;padding:0 4px;border-radius:3px;white-space:nowrap}
.tag.sel{background:#c9a27e;color:#2b211b}
.tag.you{background:#f7f0e3;color:#2b211b;border:1px solid #2b211b}
@keyframes bob{50%{transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.bub.need{animation:none}}
.feed{position:absolute;left:8px;bottom:8px;display:flex;flex-direction:column;gap:4px;max-width:min(55%,340px);pointer-events:none}
.feed div{background:rgba(30,22,18,.84);color:#efe6d8;font-size:10px;padding:4px 8px;border-radius:6px;line-height:1.3}
.feed b{color:#e2c08d}

.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.rule{margin:6px 0 0;font-size:12px;color:var(--muted);max-width:75ch}

h2{font-family:var(--f-display);font-weight:500;font-size:15px;letter-spacing:.4px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.empty{font-size:12.5px;color:var(--muted);padding:10px 12px;border:1px dashed var(--line);border-radius:10px;margin:0}
.av{width:34px;height:34px;flex:none;border-radius:6px;display:grid;place-items:center;font-family:var(--f-mono);font-size:10px;font-weight:600;color:#f7f0e3;position:relative;overflow:hidden}
.av::before{content:"";position:absolute;inset:0 0 auto;height:9px;background:var(--hair)}
.av span{position:relative;margin-top:8px}
.raw{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);overflow-wrap:anywhere}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;color:var(--st);background:color-mix(in srgb,var(--st) 14%,transparent);border:1px solid color-mix(in srgb,var(--st) 40%,transparent)}
.pill.solid{background:var(--st);color:#fff;border-color:var(--st)}
.dur{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.src{font-family:var(--f-mono);font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;white-space:nowrap}

/* chat panel */
.chatpanel{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cp-head{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.cp-head .who{min-width:0;flex:1}
.cp-head .nm{font-weight:700;font-size:14px;line-height:1.2}
.cp-head .side{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.cp-tabs{display:flex;border-bottom:1px solid var(--line)}
.cp-tabs button{flex:1;border:0;background:none;padding:9px 6px;font-size:12.5px;color:var(--muted);border-bottom:2px solid transparent}
.cp-tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
.cp-body{flex:1;min-height:0;overflow:auto;padding:12px 14px}
.msgs{display:flex;flex-direction:column;gap:10px}
.msg{max-width:86%;padding:8px 11px;border-radius:12px;font-size:13px;line-height:1.4;overflow-wrap:anywhere}
.msg.agent{align-self:flex-start;background:var(--chip);border-bottom-left-radius:4px}
.msg.you{align-self:flex-end;background:var(--accent);color:var(--panel);border-bottom-right-radius:4px}
.msg.sys{align-self:center;color:var(--muted);font-size:11.5px;text-align:center;padding:0;max-width:100%}
.msg.asking{border:2px solid var(--need);background:color-mix(in srgb,var(--need) 8%,var(--panel))}
.msg.asking b{color:var(--need)}
.msg time{display:block;font-family:var(--f-mono);font-size:10px;opacity:.7;margin-top:3px}
.msg .row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.info dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;margin:0 0 14px;font-size:12.5px}
.info dt{color:var(--muted)}
.info dd{margin:0;overflow-wrap:anywhere}
.tl{list-style:none;margin:0;padding:0;font-size:12.5px;display:flex;flex-direction:column;gap:5px}
.tl li{display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px}
.tl time{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.tl .w{font-weight:700}
.sub2{font-size:12px;color:var(--muted);margin:0 0 6px}
.composer{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.composer textarea{width:100%;box-sizing:border-box;resize:none;min-height:58px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:13px;padding:8px 10px}
.composer textarea:focus{outline:2px solid var(--accent);outline-offset:0}
.composer .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hint{font-size:11.5px;color:var(--muted)}

/* session dock */
.dock{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.dcard{flex:none;width:200px;display:grid;grid-template-columns:34px minmax(0,1fr);gap:4px 10px;align-content:start;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.dcard.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.dcard.needcard{border-color:var(--need);background:color-mix(in srgb,var(--need) 6%,var(--panel))}
.dcard .nm{font-weight:700;font-size:13px;line-height:1.2}
.dcard .rl{font-size:11.5px;color:var(--muted);overflow-wrap:anywhere;line-height:1.3}
.dcard .ft{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:6px}
.addcard{flex:none;width:150px;border:1px dashed var(--line);border-radius:10px;background:none;color:var(--muted);font-size:13px;padding:10px}
.addcard:hover{border-color:var(--accent);color:var(--ink)}

.toast{position:absolute;top:12px;right:12px;z-index:5;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--need);border-radius:10px;padding:10px 12px;box-shadow:0 8px 24px rgba(42,32,26,.2);font-size:13px;max-width:320px;display:flex;gap:10px;align-items:flex-start;text-align:left;cursor:pointer}
.toast .ti{font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.tabs{display:none}

@container app (max-width: 980px){.feed{display:none}}

/* live connection bar + team picker */
.conn{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;padding:5px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:8px;flex:none}
.conn .dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.conn[data-mode="live"] .dot{background:var(--work)}
.conn[data-mode="stale"] .dot{background:var(--idle)}
.conn[data-mode="sample"] .dot{background:var(--sleep)}
.conn .cm{flex:1;min-width:200px}
.teampanel{position:absolute;inset:0;z-index:10;background:color-mix(in srgb,var(--ink) 35%,transparent);display:flex;align-items:flex-start;justify-content:center;padding:40px 12px}
.tp-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;max-width:560px;width:100%;display:flex;flex-direction:column;gap:10px;max-height:80vh}
.tlist{overflow:auto;display:flex;flex-direction:column;gap:6px;min-height:0}
.trow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.trow label b{display:block;font-size:13px;overflow-wrap:anywhere}
.trow small{color:var(--muted);font-size:11.5px}
.lead-pick{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.tp-card .row{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Phone layout ---------- */
@container app (max-width: 640px){
  .mapwrap{flex:none;height:52vh;min-height:260px}
  .mlegend{display:none}
  .app[data-tab] .pane,.app[data-tab] .dockwrap{flex:none}
  #chatToggle{display:none}
  .top{gap:10px;padding-bottom:10px;margin-bottom:10px}
  .counts{margin-left:0;width:100%}
  .controls{width:100%}
  .body{display:flex;flex-direction:column;gap:12px}
  .pane,.dockwrap{display:none}
  .app[data-tab="office"] .pane[data-pane="office"],.app[data-tab="office"] .dockwrap,
  .app[data-tab="chat"] .pane[data-pane="chat"]{display:block}
  .pane[data-pane="chat"]{min-height:0}
  .chatpanel{position:static;height:min(620px,72vh)}
  .feed,.rule{display:none}
  .bub{font-size:calc(8.5px * var(--bs,1.3));max-width:calc(100px * var(--bs,1.3));padding:1px 4px;border-width:1.5px}
  .tag{font-size:calc(7.5px * var(--bs,1.3));padding:0 3px}
  .dcard{width:180px}
  .tabs{display:grid;grid-template-columns:repeat(2,1fr);position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);margin-top:12px;z-index:4}
  .tabs button{border:0;background:none;padding:10px 4px 12px;font-size:12.5px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);position:relative}
  .tabs button[aria-selected="true"]{color:var(--accent);font-weight:700}
  .tabs i{width:18px;height:3px;border-radius:2px;background:currentColor;opacity:.6}
  .tabs .badge{position:absolute;top:6px;left:calc(50% + 12px);background:var(--need);color:#fff;font-size:10px;font-family:var(--f-mono);border-radius:999px;padding:0 5px}
  .toast{left:10px;right:10px;max-width:none;top:8px}
}

/* ---------- Android preview frame ---------- */
.stage[data-device="android"]{display:flex;justify-content:center}
.stage[data-device="android"] .app{width:min(392px,100%);height:min(820px,88vh);border:11px solid var(--frame);border-radius:40px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(42,32,26,.3)}
.stage[data-device="android"] .statusbar{display:flex;justify-content:space-between;padding:8px 18px 4px;font-family:var(--f-mono);font-size:11px;color:var(--muted);flex:none}
.stage[data-device="android"] .top{padding:4px 14px 10px;flex:none}
.stage[data-device="android"] .body{flex:1;overflow:auto;padding:0 12px 12px}
.stage[data-device="android"] .tabs{position:static;margin-top:0;flex:none}
.devnote{display:none}
.mlegend{position:absolute;right:8px;bottom:8px;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px 10px;max-width:60%;background:rgba(30,22,18,.8);color:#efe6d8;font-size:10.5px;padding:4px 8px;border-radius:6px;pointer-events:none}
.mlegend span{display:flex;align-items:center;gap:4px}
@container app (max-width: 640px){.mlegend{display:none}}
/* 0.4 preview */
.fxbar{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.fxbar label{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;padding:3px 9px;border:1px solid var(--line);border-radius:999px;background:var(--bg);cursor:pointer}
.fxbar input{accent-color:var(--accent)}
.mocktag{font-family:var(--f-mono);font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--panel);background:var(--accent);padding:2px 7px;border-radius:4px}
.en{width:calc(26px * var(--bs,1.3));height:3px;border-radius:2px;background:rgba(43,33,27,.45);overflow:hidden;margin-top:1px}
.en i{display:block;height:100%}
.react{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);font-size:calc(13px * var(--bs,1.3));animation:floatUp 2.4s ease-out forwards;pointer-events:none}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,6px) scale(.6)}15%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-34px) scale(1)}}
@media (prefers-reduced-motion:reduce){.react{animation-duration:.01s}}
.tl8{grid-column:1/-1;display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--chip)}
.tl8 b{display:block;height:100%}
.mood{font-size:13px;margin-left:4px}
.alist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.alrow{display:grid;grid-template-columns:6px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer}
.alrow i{width:6px;align-self:stretch;border-radius:3px;background:var(--idle)}
.alrow.p1 i{background:var(--need)}.alrow.p2 i{background:#d99a1c}
.alrow.unack i{animation:blinkA 1s steps(2,start) infinite}
@keyframes blinkA{to{visibility:hidden}}
.alrow .m{min-width:0;font-size:13px}.alrow .m b{display:block;font-family:var(--f-mono);font-size:11px}
.ackd{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
/* app build: no device preview, no in-app reply yet */
.seg{display:none!important}
.composer{display:none!important}
.qr{display:grid;place-items:center;background:#fff;border-radius:10px;padding:10px;border:1px solid var(--line)}
.qr img{width:min(240px,70vw);height:auto;display:block}
.okmsg{color:var(--work);font-weight:700}

<script>
(()=>{
const T=16,W=672,H=368,CORR=192;
const cv=document.getElementById('map'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
let paused=false,pausedAcc=0,pauseAt=0;
const now=()=>paused?pauseAt-pausedAcc:Date.now()-pausedAcc;
const MIN=60000;

/* ---------- data ---------- */
const ROLES={LEAD:'Team Lead',BE:'Backend',FE:'Frontend',QA:'QA Tester',OPS:'DevOps',DOCS:'Docs Writer',SEC:'Security',DATA:'Data'};
const SHORT={LEAD:'Lead',BE:'Backend',FE:'Frontend',QA:'QA',OPS:'DevOps',DOCS:'Docs',SEC:'Security',DATA:'Data'};
const PAL={
 LEAD:{hair:'#2b1d14',skin:'#d9a47a',shirt:'#4f5d6b',pants:'#2e2a28'},
 BE:{hair:'#1e1712',skin:'#b88458',shirt:'#6f7d5c',pants:'#3b3532'},
 FE:{hair:'#6a3a22',skin:'#e6bb94',shirt:'#9a6450',pants:'#35302d'},
 QA:{hair:'#3a2a1a',skin:'#a97650',shirt:'#a88a4e',pants:'#3a3532'},
 OPS:{hair:'#57514c',skin:'#dcae88',shirt:'#6a5f74',pants:'#2e2b2a'},
 DOCS:{hair:'#9a6c3a',skin:'#e8c4a2',shirt:'#5f7c78',pants:'#403a36'},
 SEC:{hair:'#1a1614',skin:'#9c6844',shirt:'#7a4a42',pants:'#2b2826'},
 DATA:{hair:'#3f2a32',skin:'#e0b08c',shirt:'#7d7458',pants:'#33302d'}};
// [bubble text, full description]
const ACTS={
 LEAD:[['Nagpaplano.','Pinaplano ang mga milestone ng v2 release.'],['Nagre-review.','Nire-review ang diff ng Backend.'],['Nagme-message.','Nagpapadala ng instructions sa Frontend session.'],['Nagbabasa.','Binabasa ang PR checklist.']],
 BE:[['Nagko-code.','Ine-edit ang payments.ts.'],['Nagte-test.','Pinapatakbo ang npm test.'],['Nagbabasa.','Binabasa ang schema.prisma.'],['Naghahanap.','Hinahanap kung saan ginagamit ang refund.'],['Nagko-code.','Ine-edit ang webhook.ts.']],
 FE:[['Nagko-code.','Ine-edit ang Checkout.tsx.'],['Nagbu-build.','Pinapatakbo ang npm run build.'],['Nagbabasa.','Binabasa ang tokens.css.'],['Nagko-code.','Ine-edit ang Button.tsx.']],
 QA:[['Nagte-test.','Pinapatakbo ang Playwright tests.'],['Nagbabasa.','Binabasa ang checkout.spec.ts.'],['Nagko-code.','Ine-edit ang fixtures.json.']],
 OPS:[['Nagko-code.','Ine-edit ang ci.yml.'],['Nagbu-build.','Pinapatakbo ang docker build.'],['Nagbabasa.','Binabasa ang cache.log.']],
 DOCS:[['Nagsusulat.','Isinusulat ang api-reference.md.'],['Nagbabasa.','Binabasa ang openapi.yaml.'],['Nagsusulat.','Ina-update ang changelog.md.']],
 SEC:[['Naghahanap.','Hinahanap ang lahat ng gumagamit ng jwt.sign.'],['Nagbabasa.','Binabasa ang auth.ts.'],['Nagte-test.','Pinapatakbo ang npm audit.']],
 DATA:[['Nagbabasa.','Binabasa ang events.sql.'],['Nagpapatakbo.','Pinapatakbo ang export.py.'],['Nagko-code.','Ine-edit ang dashboard.json.']]};
const ASKS={
 LEAD:'Handa nang i-merge ang v2 branch. Itutuloy ko na ba?',
 BE:'Pwede ko bang tanggalin ang lumang refunds table?',
 FE:'Aprubado mo ba ang bagong color tokens ng checkout?',
 QA:'May tatlong flaky tests. Ise-skip ko muna, o aayusin ko na?',
 OPS:'Kailangan ko ng permiso para mag-docker push sa registry.',
 DOCS:'English ba o Taglish ang tono ng docs?',
 SEC:'May nakalantad na API key sa .env.example. Ire-rotate ko ba?',
 DATA:'Isasama ko ba ang mga test account sa export?'};
const CHISMIS=['Alam mo ba yung bagong task?','Talaga? Sino nagsabi?','Grabe yung merge conflict kanina.','Kain tayo mamaya.','Sino kaya ang nag-push sa main?','Hindi nga? Seryoso?'];
const ST={working:{label:'Running',c:'--work'},needs:{label:'Alarm',c:'--need'},idle:{label:'Standby',c:'--idle'},done:{label:'Pa-review',c:'--done'},failed:{label:'Trip',c:'--fail'}};
const IDLE_LBL={read:'Nagbabasa',gym:'Nagdyi-gym',basketball:'Nagba-basketball',coffee:'Nagkakape',wander:'Naglalakad',chismis:'Nakikipagkwentuhan',eat:'Kumakain',cr:'Nasa CR',sleep:'Natutulog',desk:'Nasa desk',check:'Nagche-check',tv:'Nanonood ng TV',billiards:'Nagbi-billiards',chess:'Nagche-chess',darts:'Nagda-darts',stretch:'Nag-i-stretch',phone:'Nagse-cellphone',rounds:'Nag-iikot',doze:'Nakaidlip'};
const IDLE_SENT={read:'Nagbabasa sa library.',gym:'Nag-eehersisyo sa gym.',basketball:'Naglalaro ng basketball sa half court.',coffee:'Nagkakape muna sa pantry.',wander:'Naglalakad-lakad sa hallway.',chismis:'Nakikipagkwentuhan sa may water cooler.',eat:'Kumakain sa coffee bar.',cr:'Pumunta muna sa CR.',sleep:'Natutulog na sa lounge.',desk:'Nasa desk pa, hinihintay ang susunod na utos.',check:'Bumalik sa desk para tingnan kung may bagong task.',tv:'Nanonood ng TV sa lounge.',billiards:'Naglalaro ng billiards sa lounge.',chess:'Naglalaro ng chess sa HR room.',darts:'Naglalaro ng darts sa lounge.',stretch:'Nag-i-stretch sa hallway.',phone:'Nagse-cellphone muna.',rounds:'Isa-isang sinisilip ang team.',doze:'Nakaidlip sa desk.'};
const IDLE_PLACE={read:'Library',gym:'Gym',basketball:'Half court',coffee:'Pantry',eat:'Coffee bar',chismis:'Water cooler',cr:'CR',sleep:'Lounge',wander:'Hallway',desk:'Desk niya',check:'Desk niya',tv:'Lounge',billiards:'Lounge',chess:'HR room',darts:'Lounge',stretch:'Hallway',phone:'Hallway',rounds:'Work floor',doze:'Desk niya'};
const ORDER={needs:0,failed:1,done:2,working:3,idle:4};

// Control room: two rows of three consoles facing the video wall.
const DESKS=[[1.4,2.6],[5.8,2.6],[10.2,2.6],[1.4,6.2],[5.8,6.2],[10.2,6.2],[14.0,2.6],[14.0,6.2]].map(([x,y],i)=>({i,x,y,w:3,seat:{x:(x+1.5)*T,y:(y+1.55)*T},owner:null}));
const LEAD_DESK={x:18.2,y:4.4,w:3,seat:{x:19.7*T,y:5.95*T},owner:null};
const BOSS_POS={x:25*T,y:3.95*T};
const SPOTS={
 queue:[{x:23.4*T,y:11.7*T},{x:25.0*T,y:11.7*T},{x:26.6*T,y:11.7*T}],
 couch:[{x:36.4*T,y:3.3*T},{x:36.4*T,y:6.3*T},{x:39.6*T,y:3.3*T},{x:39.6*T,y:6.3*T}],
 eat:[{x:11.4*T,y:18.6*T},{x:13.1*T,y:18.6*T},{x:11.4*T,y:20.8*T},{x:13.1*T,y:20.8*T}],
 chismis:[{x:16.6*T,y:12.2*T},{x:17.9*T,y:12.2*T},{x:17.2*T,y:12.6*T}],
 coffee:[{x:10.2*T,y:14.3*T},{x:11.6*T,y:14.3*T}],
 cr:[{x:6.2*T,y:21.5*T},{x:7.8*T,y:21.5*T}],
 tv:[{x:17.6*T,y:17.3*T},{x:19.0*T,y:17.3*T},{x:20.4*T,y:17.3*T}],
 billiards:[{x:22.9*T,y:15.9*T},{x:26.4*T,y:15.9*T}],
 darts:[{x:26.0*T,y:20.7*T}],
 chess:[{x:23.2*T,y:21.0*T},{x:24.9*T,y:20.4*T}],
 read:[{x:30.2*T,y:7.0*T},{x:32.4*T,y:7.3*T},{x:30.9*T,y:9.3*T}],
 gym:[{x:29.4*T,y:15.3*T},{x:31.0*T,y:15.3*T},{x:32.5*T,y:19.2*T}],
 basketball:[{x:37.0*T,y:17.2*T},{x:39.6*T,y:18.6*T},{x:36.2*T,y:20.0*T}]};
const BOSS_SEAT={x:25*T,y:3.95*T},BOSS_MEET={x:25*T,y:7.6*T};
const taken={};
function claim(kind,s){const arr=SPOTS[kind];for(let i=0;i<arr.length;i++){const k=kind+i;if(!taken[k]||taken[k]===s.id){taken[k]=s.id;s.spot=k;return arr[i];}}return null;}
function release(s){if(s.spot){delete taken[s.spot];s.spot=null;}}

let uid=1;const sessions=[];const logs=[];let selected=0;
function simLabel(ms){return new Date(ms).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});}
function dayLabel(ms){return new Date(ms).toLocaleDateString('fil-PH',{weekday:'long',month:'short',day:'numeric'});}
function dur(ms){const m=Math.max(0,Math.floor(ms/MIN));if(m<60)return`${m} min`;const h=Math.floor(m/60);if(h<24)return`${h} oras ${m%60} min`;return`${Math.floor(h/24)} araw ${h%24} oras`;}
function log(who,text,s,at){const t=at||now();logs.unshift({t,who,text});logs.sort((a,b)=>b.t-a.t);if(logs.length>60)logs.pop();if(s){s.history.unshift({t,text});s.history.sort((a,b)=>b.t-a.t);if(s.history.length>8)s.history.pop();}renderLog();}

function mkSession(name,source,host,status,minsAgo,desk){
  const m=name.match(/^\[(\w+)\]\s*(.+)$/);const code=m?m[1]:'BE';
  const s={id:uid++,name,code,role:ROLES[code]||code,short:SHORT[code]||code,task:m?m[2]:name,source,host,status,
    since:now()-minsAgo*1000,idleStart:now()-minsAgo*1000,activity:pick(ACTS[code]),idle:null,idleUntil:0,history:[],chat:[],
    nextChange:now()+rand(6,14)*1000,pal:PAL[code]||PAL.BE,seed:Math.random()*4,desk,x:0,y:0,path:[],pose:'stand',
    typing:false,raise:false,lead:code==='LEAD'};
  if(desk)desk.owner=s;
  return s;
}

/* ---------- movement ---------- */
function roomOf(p){if(p.y>H)return'out';const tx=p.x/T;if(p.y<11*T)return tx<17?'work':tx<22?'lead':tx<28?'boss':tx<35?'lib':'sleep';if(p.y<13*T)return'corr';return tx<5?'lobby':tx<9?'cr':tx<16?'pantry':tx<22?'lounge':tx<28?'rec':tx<34?'gym':'court';return tx<7?'lounge':tx<11?'cr':tx<17?'lobby':tx<22?'hr':'cafe';}
function aisle(p){const g=[.8,5.1,9.5,13.6].map(v=>v*T);let best=g[0];for(const x of g)if(Math.abs(x-p.x)<Math.abs(best-p.x))best=x;return{x:best,y:p.y};}
function route(a,b){
  const ra=roomOf(a),rb=roomOf(b);if(ra===rb&&ra!=='out'&&ra!=='work')return[b];
  const cy=CORR-6+Math.random()*12;const pts=[];let sx=a.x;
  if(ra==='work'){const q=aisle(a);pts.push(q);sx=q.x;}
  if(ra!=='corr')pts.push({x:sx,y:cy});
  if(rb==='work'){const q=aisle(b);pts.push({x:q.x,y:cy},q);}
  else if(rb!=='corr')pts.push({x:b.x,y:cy});
  pts.push(b);return pts;
}
function goTo(e,p,onArrive){e.path=route({x:e.x,y:e.y},p);e.onArrive=onArrive||null;e.pose='walk';e.typing=false;e.raise=false;}
function place(e,p){e.x=p.x;e.y=p.y;e.path=[];}

/* ---------- status logic ---------- */
function seatOf(s){return s.lead?LEAD_DESK.seat:s.desk.seat;}
function applyStatus(s,instant){
  release(s);s.idle=null;s.errand=null;s.errandMsg=null;s.rounds=null;
  if(s.status==='idle'){startIdle(s,instant);return;}
  if(s.status==='needs'){
    const q=claim('queue',s)||{x:rand(24.5,29)*T,y:9.2*T};
    const arrive=()=>{s.pose='stand';s.raise=true;};
    if(instant){place(s,q);arrive();}else goTo(s,q,arrive);return;
  }
  const arrive=()=>{s.pose='sit';s.typing=s.status==='working';};
  if(instant){place(s,seatOf(s));arrive();}else goTo(s,seatOf(s),arrive);
}
function wanderSpot(){return{x:rand(2,40)*T,y:rand(11.4,12.6)*T};}
const idleMins=s=>(now()-s.idleStart)/MIN;
function sitAtDesk(s,instant,kind){
  release(s);s.idle=kind;
  const arrive=()=>{s.pose='sit';s.typing=false;};
  if(instant||(Math.abs(s.x-seatOf(s).x)<2&&Math.abs(s.y-seatOf(s).y)<2)){place(s,seatOf(s));arrive();}else goTo(s,seatOf(s),arrive);
}
// After a turn: stay at the desk for a few minutes. The leader stays seated unless idle for long.
function startIdle(s,instant){
  if(!s.lingerMs)s.lingerMs=rand(2,5)*MIN/SPEED();
  const el=now()-s.idleStart;
  if(s.lead){sitAtDesk(s,instant,idleMins(s)>60&&Math.random()<.5?'doze':'desk');s.idleUntil=now()+(el<s.lingerMs?s.lingerMs-el:rand(2,4)*MIN);return;}
  if(el<s.lingerMs){sitAtDesk(s,instant,'desk');s.idleUntil=s.idleStart+s.lingerMs;return;}
  pickIdle(s,instant);
}
const SIT_ACTS={tv:1,chess:1,read:1};
// Minutes each activity takes in real life; the demo switch speeds everything up 10x.
const DUR={coffee:[2,4],cr:[1,3],eat:[10,20],tv:[8,15],billiards:[6,12],chess:[10,20],basketball:[8,15],gym:[10,20],read:[8,15],darts:[3,6],stretch:[1,2],phone:[2,5],chismis:[3,8],wander:[1,3],sleep:[15,40]};
const hourNowX=0;
const hourNow=()=>{const d=new Date();return d.getHours()+d.getMinutes()/60;};
const isLunch=()=>{const x=hourNow();return x>=11.5&&x<13;};
function activityMs(act){let [a,b]=DUR[act]||[2,5];if(act==='eat'&&isLunch()){a=20;b=40;}return rand(a,b)*MIN/SPEED();}
// What a real person would do next: time of day, how tired they are, and what they just did.
function chooseActivity(s,m,was){
  const x=hourNow(),en=typeof energy==='function'?energy(s):.6,w={};
  const add=(k,n)=>{w[k]=(w[k]||0)+n;};
  ['coffee','cr','stretch','phone','chismis','wander','darts','read'].forEach(k=>add(k,2));
  if(m>=10){['tv','billiards','chess','eat','basketball','gym','read'].forEach(k=>add(k,2));}
  if(m>=30){add('sleep',4);add('tv',2);}
  if(isLunch())add('eat',14);
  if(x>=14.75&&x<15.5){add('eat',5);add('coffee',5);}               // merienda
  if(x>=17&&x<20){add('gym',5);add('basketball',6);}                // after work
  if(x>=22||x<6){add('sleep',8);add('tv',2);w.basketball=0;w.gym=0;} // night shift
  if(x>=6&&x<9)add('coffee',6);                                     // morning coffee
  if(en<.35){add('coffee',5);add('sleep',4);w.gym=0;w.basketball=0;}
  if(was==='coffee'||was==='eat')add('cr',6);                       // what goes in comes out
  if(was==='gym'||was==='basketball'){add('cr',5);add('eat',3);add('coffee',2);w.gym=0;w.basketball=0;}
  if(was==='sleep'){add('coffee',6);add('cr',4);w.sleep=0;}
  if(was&&w[was])w[was]*=.25;
  const ks=Object.keys(w).filter(k=>w[k]>0),tot=ks.reduce((a,k)=>a+w[k],0);let r=Math.random()*tot;
  for(const k of ks){r-=w[k];if(r<=0)return k;}return ks[0]||'coffee';
}
function pickIdle(s,instant){
  const m=idleMins(s),was=s.idle;
  release(s);
  // now and then, come back to the desk to see if something new arrived
  if(!instant&&was&&was!=='desk'&&was!=='check'&&m<120&&Math.random()<.3){sitAtDesk(s,false,'check');s.idleUntil=now()+rand(40,75)*1000;return;}
  const waiting=['billiards','chess','basketball'].filter(k=>taken[k+'0']&&!taken[k+'1']&&taken[k+'0']!==s.id);
  let act=(waiting.length&&Math.random()<.75)?pick(waiting):chooseActivity(s,m,was),spot=null;
  if(act==='wander'||act==='stretch'||act==='phone')spot=wanderSpot();
  else{spot=claim(act==='sleep'?'couch':act,s);if(!spot){act=pick(['wander','phone','stretch']);spot=wanderSpot();}}
  s.idle=act;s.actStart=now();s.idleUntil=now()+activityMs(act);
  const arrive=()=>{s.pose=act==='sleep'?'sleep':SIT_ACTS[act]?'sit':act==='gym'&&s.spot&&s.spot!=='gym2'?'walk':'stand';};
  if(instant){place(s,spot);arrive();}else goTo(s,spot,arrive);
}
function leadIdle(s){
  const m=idleMins(s);
  if(m>=8&&Math.random()<.55){startRounds(s);return;}
  if(m>=25&&Math.random()<.25){release(s);const sp=claim('coffee',s)||wanderSpot();s.idle='coffee';s.idleUntil=now()+rand(60,120)*1000;goTo(s,sp,()=>{s.pose='stand';});return;}
  sitAtDesk(s,false,m>60&&Math.random()<.5?'doze':'desk');s.idleUntil=now()+rand(3,6)*MIN;
}
const taskShort=o=>{const t=String(o.task||'').split(/[,;(:]/)[0].trim().toLowerCase().split(/\s+/).slice(0,5).join(' ');return t||'task mo';};
function replyFor(o){
  if(o.status==='working')return o.detail&&o.detail.length<=80?`Ayos naman, Lead. ${sent(o.detail)}`:'Ayos naman, Lead. Tuloy-tuloy ang trabaho ko.';
  if(o.status==='needs')return'Hinihintay ko pa ang sagot ni boss, Lead.';
  if(o.status==='done')return'Tapos na ako, Lead. Pa-review na lang kay boss.';
  return pick(['Tapos na ako, naghihintay ng susunod na task.','Naka-break lang ako saglit, Lead.','Wala pang bagong utos, Lead.','Ready na ako sa susunod, Lead.']);
}
function startRounds(s){
  const list=sessions.filter(o=>!o.lead&&o.desk);
  if(!list.length){s.idleUntil=now()+rand(3,6)*MIN;return;}
  release(s);s.idle='rounds';s.rounds=list.map(o=>o.id);s.idleUntil=Infinity;nextRound(s);
}

const cam={x:0,y:0,z:1.25,tx:0,ty:0,follow:null};

const kc=()=>BASE*cam.z;

function resizeMap(){
  const r=cv.parentElement.getBoundingClientRect();if(!r.width||!r.height)return;
  DPR=Math.min(2,window.devicePixelRatio||1);VW=r.width;VH=r.height;
  cv.width=Math.round(VW*DPR);cv.height=Math.round(VH*DPR);

  const narrow=VW<560;if(narrow!==resizeMap.narrow){resizeMap.narrow=narrow;cam.z=narrow?2.6:1.25;const p=cam.follow?isoP(cam.follow):iso(14,9);centerOn(p.x,p.y);}

}
function clampCam(){const vw=viewW(),vh=viewH();cam.tx=vw>=SW?(SW-vw)/2:Math.max(0,Math.min(SW-vw,cam.tx));cam.ty=vh>=SH?(SH-vh)/2:Math.max(0,Math.min(SH-vh,cam.ty));}
function centerOn(x,y){cam.tx=x-viewW()/2;cam.ty=y-viewH()/2;clampCam();}
function updateCam(dt){
  if(cam.follow){const p=isoP(cam.follow);centerOn(p.x,p.y-20);}
  const a=Math.min(1,dt*5);cam.x+=(cam.tx-cam.x)*a;cam.y+=(cam.ty-cam.y)*a;

}

  if(st==='needs')say2(s,'agent',s.ask||'May tanong ako sa iyo.',{ask:true});
  else say2(s,'agent',statusLine(s));
}
async function answer(){}
function msgHTML(s,m){
  if(m.from==='sys')return `<div class="msg sys">${esc(m.text)} · ${simLabel(m.t)}</div>`;
  const open=false;
  return `<div class="msg ${m.from}${m.ask?' asking':''}">${m.ask?'<b>Tanong:</b> ':''}${esc(m.text)}${open?`<div class="row"><button type="button" class="btn primary" data-act="reply" data-mode="approve" data-id="${s.id}">Approve</button><button type="button" class="btn" data-act="reply" data-mode="no" data-id="${s.id}">Hindi muna</button></div>`:''}<time>${m.from==='you'?'Ikaw':esc(s.short)} · ${simLabel(m.t)}</time></div>`;
}

/* panel */
function renderPanel(){
  const s=sel();if(!s)return;
  const place=s.status==='needs'?'Sa harap ng opisina mo':s.status==='idle'?(IDLE_PLACE[s.idle]||'Hallway'):s.lead?'Opisina ng Lead':'Desk '+(s.desk.i+1);
  $('cpHead').innerHTML=`${av(s,38)}<div class="who"><div class="nm">${esc(s.role)}${s.lead?' (leader)':''}</div><div class="raw">${esc(s.name)}</div></div><div class="side">${pill(s)}<span class="src">${s.source} · ${esc(s.host)}</span></div>`;
  document.querySelectorAll('.cp-tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.ptab===ptab));
  $('composer').hidden=ptab!=='chat';
  $('msgLabel').textContent=`Mensahe para kay ${s.role}`;
  const body=$('cpBody');
  if(ptab==='alarms'){
    const al=sessions.filter(x=>x.status==='needs'||x.status==='failed').sort((a,b)=>(a.acked-b.acked)||((a.prio||2)-(b.prio||2))||(b.alarmAt||0)-(a.alarmAt||0));
    const key='a'+al.map(x=>x.id+':'+x.status+':'+(x.acked?1:0)).join('|');
    if(key!==chatKey){chatKey=key;body.innerHTML=al.length?`<ul class="alist">${al.map(x=>`<li class="alrow ${x.status==='failed'||x.prio===1?'p1':'p2'} ${x.acked?'':'unack'}" data-pick="${x.id}"><i></i><span class="m"><b>${esc(x.short)} · ${x.status==='failed'?'TRIP':'NEEDS INPUT'} · ${x.status==='failed'||x.prio===1?'HIGH':'MEDIUM'}</b><span>${esc(x.status==='failed'?(x.detail||'May pumalyang command.'):(x.ask||'May tanong sa iyo.'))}</span></span>${x.acked?'<span class="ackd">ACK</span>':`<button type="button" class="btn" data-ack="${x.id}">ACK</button>`}</li>`).join('')}</ul>`:'<p class="sub2">Walang alarm. Normal ang lahat ng operator.</p>';}
  }else if(ptab==='chat'){
    const key=`c${s.id}:${s.chat.length}:${s.status}:${s.chat.filter(m=>m.answered).length}`;
    if(key!==chatKey){chatKey=key;body.innerHTML=`<div class="msgs">${s.chat.map(m=>msgHTML(s,m)).join('')}</div>`;body.scrollTop=body.scrollHeight;}
  }else if(ptab==='info'){
    chatKey='';
    loadDetail(s);
    body.innerHTML=`<div class="info"><dl><dt>Ginagawa</dt><dd>${esc(actText(s))}</dd><dt>Gaano katagal</dt><dd>${dur(now()-s.since)}</dd><dt>Nasaan</dt><dd>${esc(place)}</dd><dt>Source</dt><dd>${s.source} · ${esc(s.host)}</dd><dt>Session name</dt><dd class="raw">${esc(s.name)}</dd><dt>Role</dt><dd>${esc(s.role)}${s.lead?' (leader ng team)':' (galing sa session name)'}</dd>${liveRows(s)}</dl>
      <p class="sub2">Mga huling ginawa</p><ul class="tl">${s.history.map(h=>`<li><time>${simLabel(h.t)}</time><span>${esc(h.text)}</span></li>`).join('')||'<li><time>Ngayon</time><span>Wala pang activity.</span></li>'}</ul></div>`;
  }else{
    const key=`l${logs.length}:${logs[0]&&logs[0].t}`;
    if(key!==chatKey){chatKey=key;body.innerHTML=`<ul class="tl">${logs.map(l=>`<li><time>${simLabel(l.t)}</time><span><span class="w">${esc(l.who)}:</span> ${esc(l.text)}</span></li>`).join('')}</ul>`;}
  }
}
function liveRows(s){
  const pct=s.ctx&&s.ctx.max_tokens?Math.round(s.ctx.used_tokens/s.ctx.max_tokens*100):null;
  const arts=(s.artifacts||[]).slice(0,3).map(a=>`<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.title||'Artifact')}</a>`).join(', ');
  return `${s.detail?`<dt>Huling status</dt><dd>${esc(sent(s.detail))}</dd>`:''}${s.recent?`<dt>Huling ginawa</dt><dd>${esc(sent(s.recent))}</dd>`:''}
    <dt>Huling update</dt><dd>${esc(dayLabel(s.at))}, ${esc(simLabel(s.at))}</dd>
    ${s.cwd?`<dt>Folder</dt><dd class="raw">${esc(s.cwd)}</dd>`:''}
    ${s.repo?`<dt>Repo</dt><dd class="raw">${esc(s.repo)}${s.branch?' @ '+esc(s.branch):''}</dd>`:''}
    ${s.model?`<dt>Model</dt><dd class="raw">${esc(s.model)}</dd>`:''}
    ${pct!==null?`<dt>Context</dt><dd>${pct}% ang nagamit${pct>=70?', kaya malapit na itong mag-compact.':'.'}</dd>`:''}
    ${arts?`<dt>Artifacts</dt><dd>${arts}${s.artifacts.length>3?` at ${s.artifacts.length-3} pa.`:'.'}</dd>`:''}
    ${s.detailErr?`<dt>Paalala</dt><dd>${esc(s.detailErr)}</dd>`:''}
    <dt>Session ID</dt><dd class="raw">${esc(s.sid)}</dd>`;
}
const BLABEL={SESSION_STATUS_BUCKET_WORKING:'Nagtatrabaho',SESSION_STATUS_BUCKET_BLOCKED:'Kailangan ka',SESSION_STATUS_BUCKET_REVIEW_READY:'Pa-review',SESSION_STATUS_BUCKET_COMPLETED:'Tapos ang turn',SESSION_STATUS_BUCKET_FAILED:'May error'};
function openTeam(){
  const el=$('teamPanel');const {lead,list}=pickTeam(allRecords);const ids=new Set(list.map(r=>r.id));const names=TEAM.names||{};
  const rows=allRecords.map(r=>`<div class="trow"><input type="checkbox" id="tm-${esc(r.id)}" name="tm" value="${esc(r.id)}" ${ids.has(r.id)?'checked':''} aria-label="Isama sa office"><label for="tm-${esc(r.id)}"><input type="text" class="tname" data-id="${esc(r.id)}" value="${esc(names[r.id]||r.title)}" aria-label="Pangalan ng session" style="width:100%;box-sizing:border-box;font:inherit;font-size:13px;font-weight:700;border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:var(--bg);color:var(--ink)"><small>${esc(BLABEL[r.status_bucket]||'')} · ${esc(r.cwd?baseName(r.cwd):'')} · ${esc(simLabel(r.updated_at))}</small></label><span class="lead-pick"><input type="radio" id="tl-${esc(r.id)}" name="tl" value="${esc(r.id)}" ${r.id===lead?'checked':''}><label for="tl-${esc(r.id)}">Leader</label></span></div>`).join('')||'<p class="empty">Wala pang session na nagpadala ng update.</p>';
  el.innerHTML=`<div class="tp-card" role="dialog" aria-label="Piliin ang team"><h2>Piliin ang team</h2><p class="hint">I-check ang mga session na nasa office at piliin ang leader. Palitan ang pangalan sa format na <b>ROLE: task</b>, halimbawa <b>CODE FIXER: logic at engine</b>, para lumabas ang tamang role. Hanggang ${MAXN} na miyembro at isang leader ang kasya. Naka-save ito sa PC, kaya pareho ang makikita sa phone.</p><div class="tlist">${rows}</div><div class="row"><button type="button" class="btn" data-act="team-reset">Gamitin ang default</button><span style="flex:1"></span><button type="button" class="btn" data-act="team-cancel">Kanselahin</button><button type="button" class="btn primary" data-act="team-save">I-save</button></div></div>`;
  el.hidden=false;
}
async function saveTeam(t){
  try{const r=await fetch('/api/team',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},hdr()),body:JSON.stringify(t)});if(!r.ok)throw 0;connMsg='';}
  catch(e){connMsg='Hindi na-save ang team.';}
  version=0;setConn();
}
function rebuildTeam(){for(const s of sessions.slice())dropSession(s,'');firstLoad=true;logs.length=0;applyRecords(allRecords);setConn();}
function collectNames(){const n=Object.assign({},TEAM.names||{});document.querySelectorAll('#teamPanel .tname').forEach(i=>{const r=allRecords.find(x=>x.id===i.dataset.id);const v=i.value.trim();if(v&&(!r||v!==r.title||n[i.dataset.id]))n[i.dataset.id]=v;});return n;}
function dockCard(s){
  return `<button type="button" class="dcard ${s.id===selected?'sel':''} ${s.status==='needs'?'needcard':''}" data-id="${s.id}">${av(s)}<span style="min-width:0"><span class="nm" style="display:block">${esc(s.role)}${FX.mood?`<span class="mood" title="Energy ${Math.round(energy(s)*100)}%">${moodOf(s)}</span>`:''}</span><span class="rl" style="display:block">${esc(s.task)}</span></span><span class="ft">${pill(s)}<span class="dur">${dur(now()-s.since)}</span></span>${FX.timeline?tlHTML(s):''}</button>`;
}
function render(){
  const by=st=>sessions.filter(s=>s.status===st).length;
  const sleepN=sessions.filter(s=>s.status==='idle'&&(s.idle==='sleep'||s.idle==='doze')).length;
  const needN=by('needs');
  $('counts').innerHTML=`
    <span class="count"><i class="dot" style="background:var(--work)"></i><b>${by('working')}</b> nagtatrabaho</span>
    <span class="count need ${needN+by('failed')?'on':''}"><i class="dot" style="background:${needN?'#fff':'var(--need)'}"></i><b>${needN+by('failed')}</b> alarm</span>
    <span class="count"><i class="dot" style="background:var(--idle)"></i><b>${by('idle')-sleepN}</b> naka-break</span>
    <span class="count"><i class="dot" style="background:var(--sleep)"></i><b>${sleepN}</b> tulog</span>
    <span class="count"><i class="dot" style="background:var(--done)"></i><b>${by('done')+by('failed')}</b> tapos o may error</span>`;
  $('dock').innerHTML=sessions.map(dockCard).join('')+`<button type="button" class="addcard" data-act="add">+ Magdagdag ng session</button>`;
  renderPanel();
  const tb=$('tabBadge');tb.hidden=!needN;tb.textContent=needN;
  $('clock').textContent=dayLabel(now())+', '+simLabel(now());$('sbClock').textContent=simLabel(now()).replace(/ (AM|PM)/,'');
}
function renderLog(){
  const f=$('feed');if(!f)return;
  f.innerHTML=logs.slice(0,3).reverse().map(l=>`<div><b>${esc(l.who)}:</b> ${esc(l.text)}</div>`).join('');
}
let toastTimer;
function toast(s){
  const el=$('toast');el.hidden=false;el.dataset.id=s.id;
  el.innerHTML=`${av(s,28)}<div style="min-width:0"><div class="ti">Dev Room · ngayon</div><b>Kailangan ka ng ${esc(s.role)}.</b><div style="font-size:12.5px">${esc(s.ask||'May tanong siya sa iyo.')}</div></div>`;
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,6000);
}
function openChat(id){
  selected=id;ptab='chat';chatKey='';const fs=sessions.find(x=>x.id===id);if(fs){cam.follow=fs;if(cam.z<1.5)setZoom(1.8);}
  if(compact()){$('app').dataset.tab='chat';document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab==='chat'));}
  render();
}

/* ---------- interactions ---------- */
document.addEventListener('click',e=>{
  const ak=e.target.closest('[data-ack]');if(ak){const s=sessions.find(x=>x.id===+ak.dataset.ack);if(s){s.acked=true;log('Ikaw',`ACK: alarm ni ${s.short}.`,s);chatKey='';render();}return;}
  const pk=e.target.closest('[data-pick]');if(pk&&!e.target.closest('[data-ack]')){selected=+pk.dataset.pick;const fs=sessions.find(x=>x.id===selected);if(fs){cam.follow=fs;}chatKey='';render();return;}
  const ag=e.target.closest('.dcard');if(ag){openChat(+ag.dataset.id);return;}
  if(e.target.closest('[data-act="add"]')){addSession();return;}
  if(e.target.closest('[data-act="team"]')){openTeam();return;}
  if(e.target.closest('[data-act="hooks"]')){installHooks();return;}
  if(e.target.closest('[data-act="restart"]')){restartApp();return;}
  if(e.target.closest('[data-act="pair"]')){openPair();return;}
  if(e.target.closest('[data-act="team-cancel"]')){$('teamPanel').hidden=true;return;}
  if(e.target.closest('[data-act="team-reset"]')){saveTeam({lead:null,ids:[],names:TEAM.names||{}});$('teamPanel').hidden=true;return;}
  if(e.target.closest('[data-act="team-save"]')){
    const ids=[...document.querySelectorAll('#teamPanel input[name="tm"]:checked')].map(i=>i.value);
    const l=document.querySelector('#teamPanel input[name="tl"]:checked');let lead=l?l.value:null;
    if(lead&&!ids.includes(lead))ids.unshift(lead);
    saveTeam({lead,ids,names:collectNames()});$('teamPanel').hidden=true;return;}
  const tst=e.target.closest('#toast');if(tst){tst.hidden=true;openChat(+tst.dataset.id);return;}
  const a=e.target.closest('[data-act="reply"]');
  if(a){const s=sessions.find(x=>x.id===+a.dataset.id);if(s&&s.status==='needs')answer(s,a.dataset.mode==='approve'?'Approved. Sige, ituloy mo.':'Hindi muna. Huwag mo munang gawin iyan.',a.dataset.mode);return;}
  const pt=e.target.closest('[data-ptab]');if(pt){ptab=pt.dataset.ptab;chatKey='';renderPanel();return;}
  const tab=e.target.closest('.tabs button');if(tab){$('app').dataset.tab=tab.dataset.tab;chatKey='';document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b===tab));render();return;}
  const dv=e.target.closest('.seg button');if(dv){$('stage').dataset.device=dv.dataset.device;document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b===dv));chatKey='';render();return;}
});
$('composer').addEventListener('submit',e=>{e.preventDefault();const s=sel();const v=$('msgInput').value;if(!v.trim())return;$('msgInput').value='';answer(s,v,'text');});
$('msgInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('composer').requestSubmit();}});
let drag=null;
const toScreen=(e)=>{const r=cv.getBoundingClientRect();return{x:cam.x+(e.clientX-r.left)/kc(),y:cam.y+(e.clientY-r.top)/kc()};};
const ptrs=new Map();let pinch=null;
const pinchState=()=>{const [a,b]=[...ptrs.values()];return{d:Math.hypot(a.x-b.x,a.y-b.y),mx:(a.x+b.x)/2,my:(a.y+b.y)/2};};
cv.addEventListener('pointerdown',e=>{ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});cv.setPointerCapture(e.pointerId);
  if(ptrs.size===2){const s=pinchState();pinch={d0:s.d,z0:cam.z};drag=null;cam.follow=null;return;}
  drag={sx:e.clientX,sy:e.clientY,cx:cam.tx,cy:cam.ty,moved:false};});
cv.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&ptrs.size===2){const s=pinchState();const q=toScreen({clientX:s.mx,clientY:s.my});setZoom(pinch.z0*s.d/Math.max(1,pinch.d0),q.x,q.y);cam.x=cam.tx;cam.y=cam.ty;}});
const endPtr=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2&&pinch){pinch=null;drag=null;}};
cv.addEventListener('pointercancel',e=>{endPtr(e);drag=null;cv.classList.remove('drag');});
cv.addEventListener('pointermove',e=>{
  if(!drag)return;const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;
  if(!drag.moved&&Math.hypot(dx,dy)<5)return;
  drag.moved=true;cv.classList.add('drag');cam.follow=null;
  cam.tx=drag.cx-dx/kc();cam.ty=drag.cy-dy/kc();clampCam();cam.x=cam.tx;cam.y=cam.ty;
});
cv.addEventListener('pointerup',e=>{
  const wasPinch=!!pinch;endPtr(e);
  cv.classList.remove('drag');const d=drag;drag=null;if(wasPinch||!d||d.moved)return;
  const q=toScreen(e);
  let best=null,bd=20;for(const s of sessions){const p=isoP(s);const dd=Math.hypot(p.x-q.x,p.y-16-q.y);if(dd<bd){bd=dd;best=s;}}
  if(best){selected=best.id;cam.follow=best;ptab='chat';chatKey='';render();}
});
cv.addEventListener('wheel',e=>{e.preventDefault();const q=toScreen(e);cam.follow=null;setZoom(cam.z*(e.deltaY<0?1.15:1/1.15),q.x,q.y);},{passive:false});
$('zIn').addEventListener('click',()=>setZoom(cam.z*1.25));
$('zOut').addEventListener('click',()=>setZoom(cam.z/1.25));
$('zFit').addEventListener('click',()=>{cam.follow=null;setZoom(1);});
const BS=[1,1.3,1.6,2,2.5];let bsI=1;try{const v=localStorage.getItem('devroom.bubble');if(v!==null&&+v>=0&&+v<BS.length)bsI=+v;}catch(e){}
function applyBS(){overlay.style.setProperty('--bs',BS[bsI]);$('bsDown').disabled=bsI===0;$('bsUp').disabled=bsI===BS.length-1;try{localStorage.setItem('devroom.bubble',String(bsI));}catch(e){}}
$('bsUp').addEventListener('click',()=>{bsI=Math.min(BS.length-1,bsI+1);applyBS();});
$('bsDown').addEventListener('click',()=>{bsI=Math.max(0,bsI-1);applyBS();});
applyBS();
{const fb=$('fsBtn');const app=$('app');
 // Map-only mode. Uses the Fullscreen API when allowed, and fills the window anyway when it is not (phones, the Android app).
 const fit=()=>setTimeout(()=>{resizeMap();cam.follow=null;setZoom(1);},60);
 const setFocus=on=>{app.classList.toggle('focus',on);fb.textContent=on?'Lumabas sa fullscreen':'Fullscreen';fit();};
 fb.addEventListener('click',()=>{
   const on=!app.classList.contains('focus');setFocus(on);
   try{if(on&&document.fullscreenEnabled&&app.requestFullscreen)app.requestFullscreen().catch(()=>{});else if(!on&&document.fullscreenElement)document.exitFullscreen().catch(()=>{});}catch(e){}
 });
 document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&app.classList.contains('focus'))setFocus(false);else fit();});}
$('chatToggle').addEventListener('click',()=>{const a=$('app');a.classList.toggle('nochat');$('chatToggle').textContent=a.classList.contains('nochat')?'Ipakita ang chat':'Itago ang chat';});
$('pauseBtn').addEventListener('click',()=>{
  if(!paused){paused=true;pauseAt=Date.now();$('pauseBtn').textContent='Ituloy';}
  else{pausedAcc+=Date.now()-pauseAt;paused=false;$('pauseBtn').textContent='Pause';}
});
function addSession(){
  guardWake();say(guard,'Wala pang bagong dumarating, boss.');
  log('Guard','Kapag nagsimula o nag-prompt ka ng session sa Claude, papasok siya rito agad. Puwede mo rin siyang idagdag sa Piliin ang team.');
}
render();renderLog();requestAnimationFrame(frame);setConn();poll();
})();
