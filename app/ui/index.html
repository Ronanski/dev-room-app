<!doctype html>
<html lang="fil">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2a201a">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">
<title>Dev Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&family=Pixelify+Sans:wght@500;700&display=swap">
<style>
/* Layout: the café-office is a game window on the left, the operator sidebar on the right; under 820px it folds into a 3-tab phone app */
:root{
  --bg:#efe7da; --panel:#f8f3ea; --ink:#2a201a; --muted:#6e5f52; --line:#dccfbd; --accent:#6b4a35; --chip:#e8dece;
  --work:#5f7d4e; --need:#b24a32; --idle:#a67c2e; --sleep:#6c6a80; --done:#4f6f7a; --fail:#8a3a30;
  --frame:#2a201a;
  --f-display:"Pixelify Sans","Courier New",monospace;
  --f-body:"Atkinson Hyperlegible",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1c1613; --panel:#26201b; --ink:#efe6d8; --muted:#a99886; --line:#3a2f27; --accent:#c9a27e; --chip:#2f2721;
  --work:#8fae7a; --need:#e07a5f; --idle:#d2a75a; --sleep:#a4a2c0; --done:#87aab6; --fail:#d07060; --frame:#0e0b09; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c1613; --panel:#26201b; --ink:#efe6d8; --muted:#a99886; --line:#3a2f27; --accent:#c9a27e; --chip:#2f2721;
  --work:#8fae7a; --need:#e07a5f; --idle:#d2a75a; --sleep:#a4a2c0; --done:#87aab6; --fail:#d07060; --frame:#0e0b09; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

.stage{max-width:none;margin:0}
.stage[data-device="desktop"] .app{height:calc(100dvh - 16px);display:flex;flex-direction:column}
/* phones scroll the page: the app grows with its content (the fixed tab bar sits over the padding) */
@media (max-width:640px){.stage[data-device="desktop"] .app{height:auto;min-height:calc(100dvh - 16px)}}
.app:fullscreen{height:100vh!important;padding:10px;box-sizing:border-box}
.app.focus .top,.app.focus .conn,.app.focus .updbar:not(.counting),.app.focus .legend,.app.focus .rule,.app.focus .tabs,.app.focus .statusbar{display:none!important}
.app.focus .updbar.counting{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:60;box-shadow:0 8px 24px rgba(42,32,26,.28)}
.app.focus{position:fixed;inset:0;z-index:50;height:100%!important;padding:6px;box-sizing:border-box;background:var(--bg)}
.app.focus .body{grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"office" "dock";height:100%;row-gap:6px}
/* fullscreen keeps a one-line strip of session cards under the map */
.app.focus .dockwrap{display:block!important}
.app.focus .dock{gap:6px;padding-bottom:2px;scrollbar-width:thin}
.app.focus .dcard{width:auto;max-width:205px;grid-template-columns:22px minmax(0,auto) auto;align-items:center;gap:0 7px;padding:4px 8px 4px 5px;border-radius:8px}
.app.focus .dcard .av{width:22px;height:22px;font-size:7.5px;border-radius:5px}
.app.focus .dcard .av span{margin-top:5px}
.app.focus .dcard .nm{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app.focus .dcard .rl,.app.focus .dcard .dur,.app.focus .dcard .tl8,.app.focus .addcard{display:none!important}
.app.focus .dcard .ft{grid-column:auto}
.app.focus .dcard .pill{font-size:10.5px;padding:1px 7px;white-space:nowrap}
.app.focus .pane[data-pane="office"]{display:flex!important;height:100%}
.app.focus .mapwrap{height:100%;flex:1}
.app{container-type:inline-size;container-name:app;position:relative;background:var(--bg);overflow-x:clip}
html,body{overflow-x:hidden}
.statusbar{display:none}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:8px;flex:none}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:28px;height:28px;flex:none;background:
  linear-gradient(var(--accent),var(--accent)) 5px 10px/15px 13px no-repeat,
  linear-gradient(var(--accent),var(--accent)) 20px 13px/4px 6px no-repeat,
  linear-gradient(var(--line),var(--line)) 8px 2px/2px 6px no-repeat,
  linear-gradient(var(--line),var(--line)) 13px 3px/2px 5px no-repeat,
  linear-gradient(var(--ink),var(--ink)) 3px 24px/20px 2px no-repeat}
h1{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1;margin:0;letter-spacing:.5px}
.sub{margin:3px 0 0;color:var(--muted);font-size:12px}
.ttl{min-width:0;flex:1 1 auto}
.units{max-width:100%;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:8px 0 0;padding-bottom:2px}
.units::-webkit-scrollbar{display:none}
.units[hidden]{display:none}
.units button{flex:none;font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;min-height:32px}
.units button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.units .un{font-family:var(--f-mono);font-size:11px;opacity:.75}
.units .ub{background:var(--need);color:#fff;border-radius:999px;font-size:10.5px;font-weight:700;padding:0 6px}
.remotebox{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0}
.remotebox .hint{grid-column:1/-1;margin:0}
.remotebox .rs{font-size:12.5px;color:var(--muted)}
.remotebox .rs.ok{color:var(--work);font-weight:700}
.updpill{font:inherit;font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 9px;margin:0 2px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;min-height:0;line-height:1.6;vertical-align:baseline}
.updpill[data-st="ok"]{color:var(--work);border-color:color-mix(in srgb,var(--work) 45%,var(--line))}
.updpill[data-st="busy"]{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.updpill[data-st="act"]{color:var(--panel);background:var(--need);border-color:var(--need)}
.updpill[data-st="warn"]{color:var(--need);border-color:color-mix(in srgb,var(--need) 45%,var(--line))}
.clock{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.counts{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.count{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--chip);font-size:12.5px;font-variant-numeric:tabular-nums}
.count b{font-family:var(--f-mono)}
.count.need.on{background:var(--need);color:#fff}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.controls{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);padding:6px 12px;border-radius:8px;font-size:13px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:6px 12px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.body{display:grid;grid-template-columns:minmax(0,1fr) clamp(300px,28%,380px);grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"office chat" "dock dock";gap:10px;flex:1;min-height:0}

.pane[data-pane="office"]{display:flex;flex-direction:column;min-height:0}
.pane[data-pane="office"]{grid-area:office;min-width:0}
.pane[data-pane="chat"]{grid-area:chat;min-width:0;position:relative;min-height:540px}
.dockwrap{grid-area:dock;min-width:0}

.mapwrap{position:relative;border-radius:10px;overflow:hidden;border:3px solid var(--frame);background:#1c140f;flex:1;min-height:320px}
#map{display:block;position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;cursor:grab;touch-action:none}
#map.drag{cursor:grabbing}
.zoom{position:absolute;top:8px;right:8px;display:flex;gap:4px;z-index:3}
.zoom button{border:1px solid #2b211b;background:#f7f0e3;color:#2b211b;border-radius:6px;font-size:13px;min-width:30px;height:30px;padding:0 8px;font-weight:700}
.zoom button:hover{background:#efe2c4}
.zoom button{white-space:nowrap}
.overlay{position:absolute;inset:0;pointer-events:none}
.ent{position:absolute;left:0;top:0;will-change:transform;display:flex;flex-direction:column;align-items:center;gap:2px;width:0}
.bub{font-size:calc(9px * var(--zs,1) * var(--bs,1.3));line-height:1.25;background:#f7f0e3;color:#2b211b;border:1.5px solid #2b211b;padding:1px 5px;border-radius:5px;width:max-content;max-width:calc(130px * var(--bs,1.3));text-align:center;white-space:normal}
.bub:empty{display:none}
.bub{position:relative}
.ent.lifted .bub::after{content:"";position:absolute;left:50%;top:100%;width:1.5px;height:var(--lift,0);background:rgba(43,33,27,.55);transform:translateX(-50%)}
.bub.need{background:#b24a32;border-color:#5a2216;color:#fff;font-weight:700;animation:bob .9s ease-in-out infinite}
.bub.sleep{background:#e3ddd2;color:#5b5348}
.bub.done{background:#dfe6cf}
.bub.fail{background:#efd2c8}
.bub.npc{background:#efe2c4}
.bub.talk{background:#fffaf0}
a.btn{text-decoration:none;display:inline-block;color:inherit}
a.btn.primary{color:var(--panel)}
.updbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;padding:6px 10px;border-radius:10px;margin-bottom:8px;background:color-mix(in srgb,var(--work) 14%,var(--panel));border:1px solid color-mix(in srgb,var(--work) 45%,transparent);flex:none}
.bub.boss{background:#2b211b;color:#f7f0e3}
.tag{font-family:var(--f-mono);font-size:calc(8px * var(--zs,1) * var(--bs,1.3));font-weight:600;background:rgba(43,33,27,.82);color:#f7f0e3;padding:0 4px;border-radius:3px;white-space:nowrap}
.tag.sel{background:#c9a27e;color:#2b211b}
.tag.you{background:#f7f0e3;color:#2b211b;border:1px solid #2b211b}
@keyframes bob{50%{transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.bub.need{animation:none}}
.feed{position:absolute;left:8px;bottom:8px;display:flex;flex-direction:column;gap:4px;max-width:min(55%,340px);pointer-events:none}
.feed div{background:rgba(30,22,18,.84);color:#efe6d8;font-size:10px;padding:4px 8px;border-radius:6px;line-height:1.3}
.feed b{color:#e2c08d}

.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.rule{margin:6px 0 0;font-size:12px;color:var(--muted);max-width:75ch}

h2{font-family:var(--f-display);font-weight:500;font-size:15px;letter-spacing:.4px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.empty{font-size:12.5px;color:var(--muted);padding:10px 12px;border:1px dashed var(--line);border-radius:10px;margin:0}
.av{width:34px;height:34px;flex:none;border-radius:6px;display:grid;place-items:center;font-family:var(--f-mono);font-size:10px;font-weight:600;color:#f7f0e3;position:relative;overflow:hidden}
.av::before{content:"";position:absolute;inset:0 0 auto;height:9px;background:var(--hair)}
.av span{position:relative;margin-top:8px}
.raw{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);overflow-wrap:anywhere}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;color:var(--st);background:color-mix(in srgb,var(--st) 14%,transparent);border:1px solid color-mix(in srgb,var(--st) 40%,transparent)}
.pill.solid{background:var(--st);color:#fff;border-color:var(--st)}
.dur{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.src{font-family:var(--f-mono);font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;white-space:nowrap}

/* chat panel */
.chatpanel{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cp-head{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.cp-head .who{min-width:0;flex:1}
.cp-head .nm{font-weight:700;font-size:14px;line-height:1.2}
.cp-head .side{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.cp-tabs{display:flex;border-bottom:1px solid var(--line)}
.cp-tabs button{flex:1;border:0;background:none;padding:9px 6px;font-size:12.5px;color:var(--muted);border-bottom:2px solid transparent}
.cp-tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
.cp-body{flex:1;min-height:0;overflow:auto;padding:12px 14px}
.msgs{display:flex;flex-direction:column;gap:10px}
.msg{max-width:86%;padding:8px 11px;border-radius:12px;font-size:13px;line-height:1.4;overflow-wrap:anywhere}
.msg.agent{align-self:flex-start;background:var(--chip);border-bottom-left-radius:4px}
.msg.you{align-self:flex-end;background:var(--accent);color:var(--panel);border-bottom-right-radius:4px}
.msg.sys{align-self:center;color:var(--muted);font-size:11.5px;text-align:center;padding:0;max-width:100%}
.msg.asking{border:2px solid var(--need);background:color-mix(in srgb,var(--need) 8%,var(--panel))}
.msg.asking b{color:var(--need)}
.msg time{display:block;font-family:var(--f-mono);font-size:10px;opacity:.7;margin-top:3px}
.msg .row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.claudebar{display:flex;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);background:color-mix(in srgb,var(--accent) 8%,var(--panel))}
.claudebar .hint{font-size:11.5px}
.claudebar{padding:6px 12px}
.claudebar .btn{white-space:nowrap}
.dcard .rl{display:-webkit-box!important;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.dcard{padding:7px 10px}
.composer{padding:8px 12px;gap:5px}
.composer textarea{min-height:44px}
.composer .to{flex-wrap:nowrap}
.composer .to label{white-space:nowrap}
.composer .to select{flex:1;min-width:0;max-width:100%}
.composer details.away{font-size:11.5px;color:var(--muted)}
.composer details.away summary{cursor:pointer}
.composer details.away[open]{display:flex;flex-direction:column;gap:4px;flex:1}
.linkbtn{border:0;background:none;color:var(--accent);text-decoration:underline;font:inherit;font-size:11px;padding:0 2px;cursor:pointer}
.okchip{font-size:12px;color:var(--work);font-weight:700;padding:0 4px}
.alrow:not(.unack){opacity:.62}
.alrow:not(.unack) i{background:var(--muted)!important}
/* alarms are already in the open panel: no toasts on top of the map then */
.app.drawer .toasts{display:none}
.app.drawer .mlegend{display:none}
.dock{scroll-behavior:smooth;mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
.dock.at-end{mask-image:none}
/* fingers need bigger targets */
@media (pointer:coarse){
  .btn,.toast .acts .btn,.zoom button,.drawer-x,.cp-tabs button,.cfilter button,.composer select{min-height:40px}
  .zoom button{min-width:40px}
  .app.focus .dcard{min-height:44px}
}
/* PC: the real Claude Code chat sits over this box (a second webview inside the Dev Room window) */
.claudehost{flex:1;min-height:0;display:grid;place-items:center;color:var(--muted);font-size:13px;background:var(--bg)}
.chatpanel.embed .cp-body,.chatpanel.embed .claudebar,.chatpanel.embed .composer{display:none!important}
/* with the real Claude chat inside the app, the Chat tab is Claude itself: no extra Claude buttons */
.app.hasclaude .claudebtn,.app.hasclaude .claudebar{display:none!important}
.composer .rcpt{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;align-items:center;font-size:12px;color:var(--muted)}
.composer .rcpt::-webkit-scrollbar{display:none}
.composer .rcpt>span{white-space:nowrap;flex:none}
.composer .rcpt button{flex:none;font:inherit;font-size:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:4px 10px;display:inline-flex;gap:5px;align-items:center;cursor:pointer;min-height:30px}
.composer .rcpt button i{width:8px;height:8px;border-radius:50%}
.composer .rcpt button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel);font-weight:700}
.composer .cbox{display:flex;align-items:flex-end;gap:8px;border:1px solid var(--line);border-radius:22px;background:var(--bg);padding:5px 5px 5px 14px}
.composer .cbox:focus-within{border-color:var(--accent)}
.composer .cbox textarea{flex:1;border:0;outline:0!important;background:none;min-height:24px;max-height:160px;padding:6px 0;line-height:1.4;font-size:14px}
.composer .send{flex:none;width:38px;height:38px;border-radius:50%;border:0;background:var(--accent);color:var(--panel);display:grid;place-items:center;cursor:pointer}
.composer .send:disabled{opacity:.4;cursor:default}
.attimg{display:block;max-width:100%;max-height:260px;border-radius:10px;border:1px solid var(--line);cursor:zoom-in;background:var(--chip)}
.attcard{display:flex;gap:10px;align-items:center;text-align:left;font:inherit;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:12px;padding:10px 12px;cursor:pointer;max-width:100%}
.attcard .ic{width:34px;height:34px;flex:none;border-radius:8px;display:grid;place-items:center;background:var(--accent);color:var(--panel);font-weight:800}
.attcard small{display:block;color:var(--muted);font-size:11.5px}
.cmsg.you .attimg,.cmsg.you .attcard{margin-left:auto}
/* Artifacts and pictures open in a pop-out, not full screen. One layout per device (set by viewerMode):
   float = PC and tablet landscape: a window you drag by its bar and resize from the corner; the chat stays usable.
   card  = tablet portrait: a centered card.   sheet = phone: a sheet from the bottom (swipe down to close).
   full  = the ⤢ button, any device. */
.viewer{position:fixed;inset:0;z-index:60;pointer-events:none}
.viewer[hidden]{display:none}
.vscrim{position:absolute;inset:0;background:rgba(20,14,10,.42);pointer-events:auto;display:none;animation:vfade .16s ease-out}
.viewer[data-mode="card"] .vscrim,.viewer[data-mode="sheet"] .vscrim{display:block}
.vwin{position:absolute;box-sizing:border-box;pointer-events:auto;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 22px 60px rgba(0,0,0,.34),0 2px 8px rgba(0,0,0,.18);overflow:hidden;animation:vpop .18s ease-out}
.viewer[data-mode="card"] .vwin{left:max(16px,4vw);right:max(16px,4vw);top:50%;transform:translateY(-50%);height:min(76dvh,1000px);animation:vfade .18s ease-out}
.viewer[data-mode="sheet"] .vwin{left:0;right:0;bottom:0;height:min(88dvh,calc(100dvh - 40px));border-radius:18px 18px 0 0;border-bottom:0;padding-bottom:env(safe-area-inset-bottom);animation:vup .22s ease-out}
.viewer[data-mode="full"] .vwin{inset:0;border-radius:0;border:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);animation:none}
.vbar{display:flex;align-items:center;gap:6px;padding:6px 6px 6px 14px;border-bottom:1px solid var(--line);background:var(--chip);touch-action:none;user-select:none;-webkit-user-select:none}
.viewer[data-mode="float"] .vbar{cursor:grab}
.viewer.dragging .vbar{cursor:grabbing}
.vbar b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.vgrip{display:none;position:absolute;top:6px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:var(--line)}
.viewer[data-mode="sheet"] .vbar{position:relative;padding-top:16px}
.viewer[data-mode="sheet"] .vgrip{display:block}
.vbtn{flex:none;width:34px;height:34px;display:grid;place-items:center;border:0;border-radius:9px;background:transparent;color:var(--ink);font:inherit;font-size:17px;line-height:1;cursor:pointer}
.vbtn:hover{background:var(--line)}

/* team chat: every session's conversation in one feed */

.cfilter button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--panel)}
.cmsg{display:flex;flex-direction:column;gap:2px;max-width:92%;cursor:pointer}
.cmsg.you{align-self:flex-end;align-items:flex-end}
.cmsg .who{font-size:11px;color:var(--muted);display:flex;gap:6px;align-items:center}
.cmsg .who b{color:var(--ink)}

.msg.md hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.cp-head .raw{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.listen{align-self:stretch;font-size:12px;border:1px dashed var(--work);border-radius:8px;padding:6px 9px;color:var(--ink);background:color-mix(in srgb,var(--work) 10%,var(--panel))}
.composer .to{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}

.composer .away{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.info dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;margin:0 0 14px;font-size:12.5px}
.info dt{color:var(--muted)}
.info dd{margin:0;overflow-wrap:anywhere}
.tl{list-style:none;margin:0;padding:0;font-size:12.5px;display:flex;flex-direction:column;gap:5px}
.tl li{display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px}
.tl time{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

.sub2{font-size:12px;color:var(--muted);margin:0 0 6px}
.composer{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.composer textarea{width:100%;box-sizing:border-box;resize:none;min-height:58px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:13px;padding:8px 10px}

/* session dock */
.dock{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}

.toast-old{position:absolute;top:12px;right:12px;z-index:5;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--need);border-radius:10px;padding:10px 12px;box-shadow:0 8px 24px rgba(42,32,26,.2);font-size:13px;max-width:320px;display:flex;gap:10px;align-items:flex-start;text-align:left;cursor:pointer}

@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}

/* live connection bar + team picker */

.wn-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;max-width:520px;width:100%;display:flex;flex-direction:column;gap:10px;max-height:85vh;overflow:auto;box-shadow:0 20px 50px rgba(42,32,26,.3)}

#whatsNew{z-index:70}
.teampanel{position:absolute;inset:0;z-index:10;background:color-mix(in srgb,var(--ink) 35%,transparent);display:flex;align-items:flex-start;justify-content:center;padding:40px 12px}
.tp-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;max-width:560px;width:100%;display:flex;flex-direction:column;gap:10px;max-height:80vh}
.tlist{overflow:auto;display:flex;flex-direction:column;gap:6px;min-height:0}
.trow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px}

.trow small{color:var(--muted);font-size:11.5px}

.tp-card .row{display:flex;gap:8px;flex-wrap:wrap}
.rooms-card{max-width:680px;overflow-y:auto;overscroll-behavior:contain}

.room .rc{font-size:11.5px;color:var(--muted);white-space:nowrap}

/* ---------- movement ---------- */
function roomOf(p){if(p.y>H)return'out';const tx=p.x/T;if(p.y<11*T)return tx<17?'work':tx<22?'lead':tx<28?'boss':tx<35?'lib':'sleep';if(p.y<13*T)return'corr';return tx<5?'lobby':tx<9?'cr':tx<16?'pantry':tx<22?'lounge':tx<28?'rec':tx<34?'gym':'court';return tx<7?'lounge':tx<11?'cr':tx<17?'lobby':tx<22?'hr':'cafe';}

/* ---------- walking around things ----------
   Every piece of furniture and wall that stands on the floor is recorded while the scene is baked, on a
   half-tile grid. People walk with A* around them and through the doors, then the path is straightened where
   the line of sight is clear. */
const NAV={rec:null,grid:null,C:84,R:52,S:T/2};
function buildNav(boxes){
  const {C,R}=NAV,g=new Uint8Array(C*R);
  for(const [u,v,w,d] of boxes){
    // a thin wall still blocks every cell it touches; a small object blocks the cells under it
    const c0=Math.floor(u*2+.15),c1=Math.max(c0,Math.ceil((u+w)*2-.15)-1),r0=Math.floor(v*2+.15),r1=Math.max(r0,Math.ceil((v+d)*2-.15)-1);
    for(let r=Math.max(0,r0);r<=Math.min(R-1,r1);r++)for(let c=Math.max(0,c0);c<=Math.min(C-1,c1);c++)g[r*C+c]=1;
  }
  // the part of the floor everyone can reach (corners closed in by furniture are never used as a destination)
  const main=new Uint8Array(C*R);let best=null;const seen=new Uint8Array(C*R);
  for(let i=0;i<C*R;i++){if(g[i]||seen[i])continue;const comp=[i];seen[i]=1;for(let k=0;k<comp.length;k++){const j=comp[k],c=j%C,r=(j/C)|0;
    for(const [dc,dr] of [[1,0],[-1,0],[0,1],[0,-1]]){const nc=c+dc,nr=r+dr;if(nc<0||nr<0||nc>=C||nr>=R)continue;const q=nr*C+nc;if(!g[q]&&!seen[q]){seen[q]=1;comp.push(q);}}}
    if(!best||comp.length>best.length)best=comp;}
  if(best)for(const i of best)main[i]=1;
  NAV.grid=g;NAV.main=main;
}
const navCell=p=>[Math.max(0,Math.min(NAV.C-1,Math.floor(p.x/NAV.S))),Math.max(0,Math.min(NAV.R-1,Math.floor(p.y/NAV.S)))];
const navFree=(c,r)=>c>=0&&r>=0&&c<NAV.C&&r<NAV.R&&!NAV.grid[r*NAV.C+c];
const navOk=(c,r)=>navFree(c,r)&&NAV.main[r*NAV.C+c];
function navNearest(c,r){if(navOk(c,r))return[c,r];for(let k=1;k<14;k++)for(let dr=-k;dr<=k;dr++)for(let dc=-k;dc<=k;dc++){if(Math.max(Math.abs(dc),Math.abs(dr))!==k)continue;if(navOk(c+dc,r+dr))return[c+dc,r+dr];}return null;}
// clear line between two cell centres, with a body's width of room on every side
function navLos(a,b){const n=Math.ceil(Math.max(Math.abs(b[0]-a[0]),Math.abs(b[1]-a[1]))*4);for(let i=1;i<n;i++){const t=i/n;const x=a[0]+.5+(b[0]-a[0])*t,y=a[1]+.5+(b[1]-a[1])*t;
  for(const [ox,oy] of [[-.35,-.35],[.35,-.35],[-.35,.35],[.35,.35]])if(!navFree(Math.floor(x+ox),Math.floor(y+oy)))return false;}return true;}
function navPath(a,b){
  if(!NAV.grid)return null;
  const s=navNearest(...navCell(a)),e=navNearest(...navCell(b));if(!s||!e)return null;
  const {C,R}=NAV,N=C*R,start=s[1]*C+s[0],goal=e[1]*C+e[0];
  const gs=new Float32Array(N).fill(1e9),from=new Int32Array(N).fill(-1),done=new Uint8Array(N);
  const heap=[];const push=(i,f)=>{heap.push([f,i]);let k=heap.length-1;while(k){const p=(k-1)>>1;if(heap[p][0]<=heap[k][0])break;[heap[p],heap[k]]=[heap[k],heap[p]];k=p;}};
  const pop=()=>{const top=heap[0],last=heap.pop();if(heap.length){heap[0]=last;let k=0;for(;;){const l=2*k+1,r=l+1;let m=k;if(l<heap.length&&heap[l][0]<heap[m][0])m=l;if(r<heap.length&&heap[r][0]<heap[m][0])m=r;if(m===k)break;[heap[m],heap[k]]=[heap[k],heap[m]];k=m;}}return top;};
  const h=i=>{const dx=Math.abs(i%C-e[0]),dy=Math.abs(((i/C)|0)-e[1]);return Math.max(dx,dy)+.41*Math.min(dx,dy);};
  gs[start]=0;push(start,h(start));let found=false,steps=0;
  while(heap.length&&steps++<N*2){const [,i]=pop();if(done[i])continue;done[i]=1;if(i===goal){found=true;break;}
    const c=i%C,r=(i/C)|0;
    for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(!dc&&!dr)continue;const nc=c+dc,nr=r+dr;if(!navFree(nc,nr))continue;
      if(dc&&dr&&(!navFree(c+dc,r)||!navFree(c,r+dr)))continue;   // no cutting corners
      const j=nr*C+nc,ng=gs[i]+(dc&&dr?1.41:1);if(ng<gs[j]){gs[j]=ng;from[j]=i;push(j,ng+h(j));}}}
  if(!found)return null;
  const cells=[];for(let i=goal;i!==-1;i=from[i])cells.push([i%C,(i/C)|0]);cells.reverse();
  // straighten: keep a corner only where the straight line would hit something
  const out=[];let k=0;while(k<cells.length-1){let j=cells.length-1;while(j>k+1&&!navLos(cells[k],cells[j]))j--;out.push(cells[j]);k=j;}
  const pts=out.map(([c,r])=>({x:(c+.5)*NAV.S,y:(r+.5)*NAV.S}));

}
function route(a,b){
  const p=navPath(a,b);if(p)return p;
  const ra=roomOf(a),rb=roomOf(b);if(ra===rb&&ra!=='out'&&ra!=='work')return[b];
  const cy=CORR-6+Math.random()*12;const pts=[];let sx=a.x;
  if(ra==='work'){const q=aisle(a);pts.push(q);sx=q.x;}
  if(ra!=='corr')pts.push({x:sx,y:cy});
  if(rb==='work'){const q=aisle(b);pts.push({x:q.x,y:cy},q);}
  else if(rb!=='corr')pts.push({x:b.x,y:cy});

}
function goTo(e,p,onArrive){e.path=route({x:e.x,y:e.y},p);e.onArrive=onArrive||null;e.pose='walk';e.typing=false;e.raise=false;}
function place(e,p){e.x=p.x;e.y=p.y;e.path=[];}

/* ---------- status logic ---------- */
function seatOf(s){return s.lead?LEAD_DESK.seat:s.desk.seat;}
function applyStatus(s,instant){
  release(s);s.idle=null;s.errand=null;s.errandMsg=null;s.rounds=null;
  if(s.status==='idle'){startIdle(s,instant);return;}
  if(s.status==='needs'){
    const q=claim('queue',s)||{x:rand(24.5,29)*T,y:9.2*T};
    const arrive=()=>{s.pose='stand';s.raise=true;};
    if(instant){place(s,q);arrive();}else goTo(s,q,arrive);return;
  }
  const arrive=()=>{s.pose='sit';s.typing=s.status==='working';};
  if(instant){place(s,seatOf(s));arrive();}else goTo(s,seatOf(s),arrive);
}
function wanderSpot(){return{x:rand(2,40)*T,y:rand(11.4,12.6)*T};}
const idleMins=s=>(now()-s.idleStart)/MIN;
function sitAtDesk(s,instant,kind){
  release(s);s.idle=kind;
  const arrive=()=>{s.pose='sit';s.typing=false;};
  if(instant||(Math.abs(s.x-seatOf(s).x)<2&&Math.abs(s.y-seatOf(s).y)<2)){place(s,seatOf(s));arrive();}else goTo(s,seatOf(s),arrive);
}
// After a turn: stay at the desk for a few minutes. The leader stays seated unless idle for long.
function startIdle(s,instant){
  if(!s.lingerMs)s.lingerMs=rand(2,5)*MIN/SPEED();
  const el=now()-s.idleStart;
  if(s.lead){sitAtDesk(s,instant,idleMins(s)>60&&Math.random()<.5?'doze':'desk');s.idleUntil=now()+(el<s.lingerMs?s.lingerMs-el:rand(2,4)*MIN);return;}
  if(el<s.lingerMs){sitAtDesk(s,instant,'desk');s.idleUntil=s.idleStart+s.lingerMs;return;}
  pickIdle(s,instant);
}
const SIT_ACTS={tv:1,chess:1,read:1};
// Minutes each activity takes in real life; the demo switch speeds everything up 10x.
const DUR={coffee:[2,4],cr:[1,3],eat:[10,20],tv:[8,15],billiards:[6,12],chess:[10,20],basketball:[8,15],gym:[10,20],read:[8,15],darts:[3,6],stretch:[1,2],phone:[2,5],chismis:[3,8],wander:[1,3],sleep:[15,40]};
const hourNowX=0;
const hourNow=()=>{const d=new Date();return d.getHours()+d.getMinutes()/60;};
const isLunch=()=>{const x=hourNow();return x>=11.5&&x<13;};
function activityMs(act){let [a,b]=DUR[act]||[2,5];if(act==='eat'&&isLunch()){a=20;b=40;}return rand(a,b)*MIN/SPEED();}
// What a real person would do next: time of day, how tired they are, and what they just did.
function chooseActivity(s,m,was){
  const x=hourNow(),en=typeof energy==='function'?energy(s):.6,w={};
  const add=(k,n)=>{w[k]=(w[k]||0)+n;};
  ['coffee','cr','stretch','phone','chismis','wander','darts','read'].forEach(k=>add(k,2));
  if(m>=4){['tv','billiards','chess','read'].forEach(k=>add(k,2));add('eat',1.5);add('basketball',2.5);add('gym',2.5);}
  if(m>=20){add('sleep',3+Math.min(5,m/30));add('tv',1);}
  if(isLunch())add('eat',14);
  if(x>=14.75&&x<15.5){add('eat',5);add('coffee',5);}               // merienda
  if(x>=17&&x<20){add('gym',5);add('basketball',6);}                // after work
  if(x>=22||x<6){add('sleep',8);add('tv',2);w.basketball=0;w.gym=0;} // night shift
  if(x>=6&&x<9)add('coffee',6);                                     // morning coffee
  if(en<.35){add('coffee',5);add('sleep',4);w.gym=0;w.basketball=0;}
  if(was==='coffee'||was==='eat')add('cr',6);                       // what goes in comes out
  if(was==='gym'||was==='basketball'){add('cr',5);add('eat',3);add('coffee',2);w.gym=0;w.basketball=0;}
  if(was==='sleep'){add('coffee',6);add('cr',4);w.sleep=0;}
  for(const [i,k] of (s.hist||[]).entries())if(w[k])w[k]*=[.15,.4,.7][i]||1;   // not the same thing again and again
  if(was&&w[was])w[was]*=.25;
  const ks=Object.keys(w).filter(k=>w[k]>0),tot=ks.reduce((a,k)=>a+w[k],0);let r=Math.random()*tot;
  for(const k of ks){r-=w[k];if(r<=0)return k;}return ks[0]||'coffee';
}
function pickIdle(s,instant){
  const m=idleMins(s),was=s.idle;
  release(s);
  // now and then, come back to the desk to see if something new arrived
  if(!instant&&was&&was!=='desk'&&was!=='check'&&m<120&&Math.random()<.12){sitAtDesk(s,false,'check');s.idleUntil=now()+rand(40,75)*1000;return;}
  const waiting=['billiards','chess','basketball'].filter(k=>taken[k+'0']&&!taken[k+'1']&&taken[k+'0']!==s.id);
  let act=(waiting.length&&Math.random()<.75)?pick(waiting):chooseActivity(s,m,was),spot=null;
  if(act==='wander'||act==='stretch'||act==='phone')spot=wanderSpot();
  else{spot=claim(act==='sleep'?'couch':act,s);if(!spot){act=pick(['wander','phone','stretch']);spot=wanderSpot();}}
  s.idle=act;s.actStart=now();s.idleUntil=now()+activityMs(act);s.hist=[act,...(s.hist||[])].slice(0,3);
  const arrive=()=>{s.pose=act==='sleep'?'sleep':SIT_ACTS[act]?'sit':act==='gym'&&s.spot&&s.spot!=='gym2'?'walk':'stand';};
  if(instant){place(s,spot);arrive();}else goTo(s,spot,arrive);
}
function leadIdle(s){
  const m=idleMins(s);
  if(m>=8&&Math.random()<.55){startRounds(s);return;}
  if(m>=25&&Math.random()<.25){release(s);const sp=claim('coffee',s)||wanderSpot();s.idle='coffee';s.idleUntil=now()+rand(60,120)*1000;goTo(s,sp,()=>{s.pose='stand';});return;}
  sitAtDesk(s,false,m>60&&Math.random()<.5?'doze':'desk');s.idleUntil=now()+rand(3,6)*MIN;
}
const taskShort=o=>{const t=String(o.task||'').split(/[,;(:]/)[0].trim().toLowerCase().split(/\s+/).slice(0,5).join(' ');return t||'task mo';};
function replyFor(o){
  if(o.status==='working')return o.detail&&o.detail.length<=80?`Ayos naman, Lead. ${sent(o.detail)}`:'Ayos naman, Lead. Tuloy-tuloy ang trabaho ko.';
  if(o.status==='needs')return'Hinihintay ko pa ang sagot ni boss, Lead.';
  if(o.status==='done')return'Tapos na ako, Lead. Pa-review na lang kay boss.';
  return pick(['Tapos na ako, naghihintay ng susunod na task.','Naka-break lang ako saglit, Lead.','Wala pang bagong utos, Lead.','Ready na ako sa susunod, Lead.']);
}
function startRounds(s){
  const list=sessions.filter(o=>!o.lead&&o.desk);
  if(!list.length){s.idleUntil=now()+rand(3,6)*MIN;return;}
  release(s);s.idle='rounds';s.rounds=list.map(o=>o.id);s.idleUntil=Infinity;nextRound(s);

function nextRound(s){
  if(s.status!=='idle'||!s.rounds)return;
  const o=sessions.find(x=>x.id===s.rounds.shift());
  if(!o){if(s.rounds.length)return nextRound(s);s.rounds=null;sitAtDesk(s,false,'desk');s.idleUntil=now()+rand(4,7)*MIN;talk(s,'Ayos, okay naman ang lahat.');return;}
  const seated=o.pose==='sit'&&!o.path.length&&o.status!=='needs'&&!SIT_ACTS[o.idle];
  const at=seated?{x:seatOf(o).x+T*1.2,y:seatOf(o).y-2}:{x:o.x+T*1.1,y:o.y};
  goTo(s,at,()=>{s.pose='stand';
    talk(s,`${o.short}, kamusta ang ${taskShort(o)}?`);
    setTimeout(()=>{if(sessions.includes(o))talk(o,replyFor(o));},2400);
    setTimeout(()=>nextRound(s),8000);});
}
// How far a session got, from its own task list: started, in progress (n of m) or done.
function prog(s){const t=s.tasks||[],total=t.length,done=t.filter(x=>x.st==='completed').length,cur=t.find(x=>x.st==='in_progress')||null;
  const phase=total?(done===total?'done':done||cur?'doing':'start'):(s.status==='working'?'start':'');
  return{total,done,cur,phase,pct:total?Math.round(done*100/total):0};}
function progLabel(s){const p=prog(s);if(!p.total)return p.phase==='start'?'Sinimulan':'';return p.phase==='done'?'Tapos na lahat':`${p.done} sa ${p.total} tapos`;}
// After real work she brings her report to your office, then goes back to her desk.

    talk(s,p.total?`Tapos na po, Boss: ${p.done} sa ${p.total} na task.`:pick(['Tapos na po, Boss. Nasa chat ang report ko.','Boss, tapos na. Pakitingnan na lang po.','Done na po, Boss!']));react(s,'📋');
    if(boss&&!boss.path.length)setTimeout(()=>say(boss,pick([`Salamat, ${s.short}.`,'Sige, titingnan ko.','Ayos, good job!'])),1600);

function setStatus(s,st,why){
  const prev=s.status,wasAct=s.idle,prevSince=s.since;s.status=st;s.since=s.at||now();
  if(st==='needs'||st==='failed'){s.acked=false;s.alarmAt=now();s.prio=/permission/i.test(s.ask||'')||st==='failed'?1:2;}
  if(s.tl){s.tl.push({st,from:now()});const cut=now()-8*60*MIN;while(s.tl.length>2&&s.tl[1].from<cut)s.tl.shift();}
  if(st==='idle'&&prev!=='idle'){s.idleStart=s.since;s.lingerMs=rand(2,5)*MIN/SPEED();}
  s.talk=null;s.talkNext=now()+1500;
  log(s.short,why||statusLine(s),s);
  addChatFor(s,st,why);
  if(st==='needs'||st==='failed')toast(s);
  applyStatus(s,false);
  if(st==='idle'&&prev==='working'&&!firstLoad&&s.since-prevSince>60000)reportToBoss(s);
  // called back from a break: say so and hurry to the desk
  if(st==='working'&&prev!=='working'&&wasAct&&!/^(desk|check|rounds)$/.test(wasAct)){s.hurry=true;s.talk={text:pick(BACK_LINES[wasAct]||BACK_LINES._),until:now()+4500};}
  render();
}

// What the session is doing right now, read from the hook's tool label ("Nagko-code.", "Nagbabasa." ...).

function lineFor(s){

  else if(s.status==='needs'){pool=POOL.needs;if(s.ask)real.push(s.ask,s.ask);}
  else if(s.status==='done'||s.status==='failed')pool=POOL[s.status];
  else{pool=POOL[s.idle]||POOL.desk;if(s.idle==='desk'&&s.recent&&s.recent.length<=110)real.push('Tapos ko na: '+lc1(sent(s.recent)));}

}

    else if(r.status===401){mode='auth';}

      mode='live';lastSync=Date.now();
      if(teamChanged&&!firstLoad){allRecords=j.sessions;rebuildTeam();}else applyRecords(j.sessions);
      awayMode=j.away||awayMode;
      // the old "wait for the app" option is gone: messages are real time now, so a held turn is never wanted

      {const cn=(j.sessions||[]).map(r=>r.id+':'+(r.convo_n||0)).join(',');if(cn!==convoKey){convoKey=cn;loadConvo();}}
    }else mode='offline';
  }catch(e){mode='offline';}
  setConn();setTimeout(poll,document.hidden?5000:mode==='live'?1000:3000);
}

const autoRestart={ready:false,ver:'',left:0,timer:0,waitUntil:0,lastInput:Date.now(),

// built from escaped text only, so nothing in a reply can inject HTML.
function md(src){
  const inline=t=>esc(t)
    .replace(/`([^`\n]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*\n]+?)\*\*/g,'<b>$1</b>').replace(/__([^_\n]+?)__/g,'<b>$1</b>')
    .replace(/(^|[^*\w])\*([^*\n]+?)\*(?!\w)/g,'$1<i>$2</i>').replace(/(^|[^_\w])_([^_\n]+?)_(?!\w)/g,'$1<i>$2</i>')
    .replace(/\[([^\]\n]+)\]\((https?:[^)\s]+)\)/g,'$1');
  const lines=String(src||'').replace(/\r/g,'').split('\n');const out=[];let list=null,para=[],code=null;
  const flushP=()=>{if(para.length){out.push('<p>'+para.map(inline).join('<br>')+'</p>');para=[];}};
  const flushL=()=>{if(list){out.push(`<${list.t}>`+list.items.map(x=>'<li>'+inline(x)+'</li>').join('')+`</${list.t}>`);list=null;}};
  for(const ln of lines){
    if(code!==null){if(/^\s*```/.test(ln)){out.push('<pre><code>'+esc(code.join('\n'))+'</code></pre>');code=null;}else code.push(ln);continue;}
    if(/^\s*```/.test(ln)){flushP();flushL();code=[];continue;}
    let m;
    if(!ln.trim()){flushP();flushL();continue;}
    if((m=ln.match(/^\s{0,3}#{1,6}\s+(.*)$/))){flushP();flushL();out.push('<p class="h">'+inline(m[1])+'</p>');continue;}
    if(/^\s*([-*_])\s*\1\s*\1[\s\-*_]*$/.test(ln)){flushP();flushL();out.push('<hr>');continue;}
    if((m=ln.match(/^\s*[-*+]\s+(.*)$/))){flushP();if(!list||list.t!=='ul'){flushL();list={t:'ul',items:[]};}list.items.push(m[1]);continue;}
    if((m=ln.match(/^\s*\d+[.)]\s+(.*)$/))){flushP();if(!list||list.t!=='ol'){flushL();list={t:'ol',items:[]};}list.items.push(m[1]);continue;}
    if(list&&/^\s{2,}\S/.test(ln)){list.items[list.items.length-1]+=' '+ln.trim();continue;}
    flushL();para.push(ln);
  }
  if(code!==null)out.push('<pre><code>'+esc(code.join('\n'))+'</code></pre>');
  flushP();flushL();return out.join('');
}

  if(compact()){const fs2=sessions.find(x=>x.id===id);if(fs2){chatFilter=fs2.sid;chatTo=fs2.sid;}$('app').dataset.tab='chat';document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab==='chat'));}
  $('app').classList.add('drawer');const b=$('chatToggle');if(b)b.textContent='Isara ang panel';
  render();
}

/* ---------- interactions ---------- */
document.addEventListener('click',e=>{
  const ak=e.target.closest('[data-ack]');if(ak){const s=sessions.find(x=>x.id===+ak.dataset.ack);if(s){s.acked=true;ackRemember(s);log('Boss',`ACK: alarm ni ${s.short}.`,s);chatKey='';render();}return;}
  const pk=e.target.closest('[data-pick]');if(pk&&!e.target.closest('[data-ack]')){selected=+pk.dataset.pick;const fs=sessions.find(x=>x.id===selected);if(fs){cam.follow=fs;}chatKey='';render();return;}
  const ag=e.target.closest('.dcard');if(ag){openChat(+ag.dataset.id);return;}
  if(e.target.closest('[data-act="add"]')){addSession();return;}
  if(e.target.closest('[data-act="team"]')){openTeam();return;}
  if(!$('teamPanel').hidden&&roomsClick(e))return;
  if(e.target.closest('[data-act="hooks"]')){installHooks();return;}
  if(e.target.closest('[data-act="restart"]')){restartApp(false);return;}
  if(e.target.closest('[data-act="remote-toggle"]')){toggleRemote();return;}
  const un=e.target.closest('[data-unit]');if(un){switchUnit(un.dataset.unit);return;}
  if(e.target.closest('[data-act="updinfo"]')){const ap=apkUpd(),pc=pcUpd();
    if(ap&&ap.act){try{window.parent.postMessage({type:'devroom:update'},'*');}catch(x){}}
    connMsg=[pc&&('PC: '+pc.d),ap&&('Phone: '+ap.d)].filter(Boolean).join(' ');setConn();clearTimeout(showUpd.t);showUpd.t=setTimeout(()=>{connMsg='';setConn();},12000);return;}
  if(e.target.closest('[data-act="restart-wait"]')){autoRestart.wait();return;}
  const cb=e.target.closest('[data-act="claude"]');if(cb){cb.closest('.toast')?.remove();openClaude(cb.dataset.sid!=null?+cb.dataset.sid:null);return;}
  if(e.target.closest('[data-act="wn-ok"]')){$('whatsNew').hidden=true;try{localStorage.setItem('devroom.seenNotes',NOTES_VER);}catch(e){}return;}
  if(e.target.closest('[data-act="pair"]')){openPair();return;}
  if(e.target.closest('[data-act="team-cancel"]')){$('teamPanel').hidden=true;return;}
  if(e.target.closest('[data-act="team-reset"]')){saveTeam({lead:null,ids:[],names:TEAM.names||{},rooms:[]});ROOMS_EDIT=null;$('teamPanel').hidden=true;return;}
  if(e.target.closest('[data-act="team-save"]')){
    const ids=[...document.querySelectorAll('#teamPanel input[name="tm"]:checked')].map(i=>i.value);
    const l=document.querySelector('#teamPanel input[name="tl"]:checked');let lead=l?l.value:null;
    if(lead&&!ids.includes(lead))ids.unshift(lead);
    saveTeam({lead,ids,names:collectNames()});$('teamPanel').hidden=true;return;}
  const oa=e.target.closest('[data-open-alarm]');if(oa){const id=+oa.dataset.openAlarm;oa.closest('.toast')?.remove();openChat(id);ptab='alarms';chatKey='';render();return;}
  if(e.target.closest('[data-act="drawer-close"]')){setDrawer(false);return;}
  if(e.target.closest('.count.need')){setDrawer(true,'alarms');return;}
  const a=e.target.closest('[data-act="reply"]');
  if(a){const s=sessions.find(x=>x.id===+a.dataset.id);if(s&&s.status==='needs')answer(s,a.dataset.mode==='approve'?'Approved. Sige, ituloy mo.':'Hindi muna. Huwag mo munang gawin iyan.',a.dataset.mode);return;}
  const pt=e.target.closest('[data-ptab]');if(pt){ptab=pt.dataset.ptab;chatKey='';renderPanel();return;}
  const tab=e.target.closest('.tabs button');if(tab){$('app').dataset.tab=tab.dataset.tab;chatKey='';if(embedClaude&&tab.dataset.tab==='chat')ptab='chat';document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b===tab));render();return;}
  const dv=e.target.closest('.seg button');if(dv){$('stage').dataset.device=dv.dataset.device;document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b===dv));chatKey='';render();return;}
});
$('composer').addEventListener('submit',async e=>{e.preventDefault();const s=bySid(chatTo);const v=$('msgInput').value;if(!v.trim())return;
  if(!s){connMsg='Wala na sa office ang napiling session. Pumili ulit sa Para kay.';setConn();return;}
  $('msgInput').value='';$('msgInput').style.height='auto';if(!await answer(s,v)&&!$('msgInput').value)$('msgInput').value=v;});
$('chatTo').addEventListener('change',e=>{chatTo=e.target.value;});
$('rcpt').addEventListener('click',e=>{const b=e.target.closest('[data-rcpt]');if(!b)return;chatTo=b.dataset.rcpt;$('rcpt').dataset.k='';renderPanel();$('msgInput').focus();});

$('viewer').addEventListener('click',e=>{

  if(e.target.closest('[data-act="vmax"]')){VWR.full=!VWR.full;layoutViewer();return;}
  // pictures: tap to see them at full size, tap again to fit
  const im=e.target.closest('.vbody img');if(im){const b=$('vBody'),z=!b.classList.contains('zoomed');const r=im.getBoundingClientRect(),fx=(e.clientX-r.left)/r.width,fy=(e.clientY-r.top)/r.height;
    b.classList.toggle('zoomed',z);if(z){b.scrollLeft=im.naturalWidth*fx-b.clientWidth/2;b.scrollTop=im.naturalHeight*fy-b.clientHeight/2;}}
});

$('composer').addEventListener('focusout',()=>setTimeout(()=>{if(!$('composer').contains(document.activeElement))$('app').classList.remove('typing');},200));
$('awaySel').addEventListener('change',e=>setAway(e.target.value));
$('cpBody').addEventListener('click',e=>{
  const rt=e.target.closest('[data-retry]');if(rt){const m=PENDING[+rt.dataset.retry];if(m){PENDING.splice(+rt.dataset.retry,1);const s=bySid(m.sid);if(s)answer(s,m.text);else{connMsg='Wala na sa office ang session na iyon.';setConn();}}chatKey='';renderPanel();return;}
  const dp=e.target.closest('[data-drop]');if(dp){PENDING.splice(+dp.dataset.drop,1);chatKey='';renderPanel();return;}
  const f=e.target.closest('[data-cf]');if(f){chatFilter=f.dataset.cf;if(chatFilter!=='all')chatTo=chatFilter;forceScroll=true;chatKey='';renderPanel();return;}
  const vw=e.target.closest('[data-view]');if(vw){openViewer(vw.dataset.view,vw.dataset.vt);return;}
  const m=e.target.closest('[data-chatto]');if(m){chatTo=m.dataset.chatto;$('rcpt').dataset.k='';$('chatTo').value=chatTo;$('msgInput').focus();}
});
$('msgInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('composer').requestSubmit();}});
let drag=null;
const toScreen=(e)=>{const r=cv.getBoundingClientRect();return{x:cam.x+(e.clientX-r.left)/kc(),y:cam.y+(e.clientY-r.top)/kc()};};
const ptrs=new Map();let pinch=null;
const pinchState=()=>{const [a,b]=[...ptrs.values()];return{d:Math.hypot(a.x-b.x,a.y-b.y),mx:(a.x+b.x)/2,my:(a.y+b.y)/2};};
cv.addEventListener('pointerdown',e=>{ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});cv.setPointerCapture(e.pointerId);
  if(ptrs.size===2){const s=pinchState();pinch={d0:s.d,z0:cam.z};drag=null;cam.follow=null;return;}
  drag={sx:e.clientX,sy:e.clientY,cx:cam.tx,cy:cam.ty,moved:false};});
cv.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&ptrs.size===2){const s=pinchState();const q=toScreen({clientX:s.mx,clientY:s.my});setZoom(pinch.z0*s.d/Math.max(1,pinch.d0),q.x,q.y);cam.x=cam.tx;cam.y=cam.ty;}});
const endPtr=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2&&pinch){pinch=null;drag=null;}};
cv.addEventListener('pointercancel',e=>{endPtr(e);drag=null;cv.classList.remove('drag');});
cv.addEventListener('pointermove',e=>{
  if(!drag)return;const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;
  if(!drag.moved&&Math.hypot(dx,dy)<5)return;
  drag.moved=true;cv.classList.add('drag');cam.follow=null;
  cam.tx=drag.cx-dx/kc();cam.ty=drag.cy-dy/kc();clampCam();cam.x=cam.tx;cam.y=cam.ty;
});
cv.addEventListener('pointerup',e=>{
  const wasPinch=!!pinch;endPtr(e);
  cv.classList.remove('drag');const d=drag;drag=null;if(wasPinch||!d||d.moved)return;
  const q=toScreen(e);
  let best=null,bd=20;for(const s of sessions){const p=isoP(s);const dd=Math.hypot(p.x-q.x,p.y-16-q.y);if(dd<bd){bd=dd;best=s;}}
  if(best){selected=best.id;cam.follow=best;ptab='chat';chatKey='';$('app').classList.add('drawer');render();}
  else if($('app').classList.contains('drawer'))setDrawer(false);
});
cv.addEventListener('wheel',e=>{e.preventDefault();const q=toScreen(e);cam.follow=null;setZoom(cam.z*(e.deltaY<0?1.15:1/1.15),q.x,q.y);},{passive:false});
$('zIn').addEventListener('click',()=>setZoom(cam.z*1.25));
$('zOut').addEventListener('click',()=>setZoom(cam.z/1.25));
$('zFit').addEventListener('click',()=>{cam.follow=null;setZoom(1);});
const BS=[1,1.3,1.6,2,2.5];let bsI=1;try{const v=localStorage.getItem('devroom.bubble');if(v!==null&&+v>=0&&+v<BS.length)bsI=+v;}catch(e){}
function applyBS(){overlay.style.setProperty('--bs',BS[bsI]);$('bsDown').disabled=bsI===0;$('bsUp').disabled=bsI===BS.length-1;try{localStorage.setItem('devroom.bubble',String(bsI));}catch(e){}}
$('bsUp').addEventListener('click',()=>{bsI=Math.min(BS.length-1,bsI+1);applyBS();});
$('bsDown').addEventListener('click',()=>{bsI=Math.max(0,bsI-1);applyBS();});
applyBS();
{const fb=$('fsBtn');const app=$('app');
 // Map-only mode. Uses the Fullscreen API when allowed, and fills the window anyway when it is not (phones, the Android app).
 const fit=()=>setTimeout(()=>{resizeMap();cam.follow=null;setZoom(1);},60);
 const setFocus=on=>{app.classList.toggle('focus',on);fb.textContent=on?'Lumabas sa fullscreen':'Fullscreen';fit();};
 fb.addEventListener('click',()=>{
   const on=!app.classList.contains('focus');setFocus(on);
   try{if(on&&document.fullscreenEnabled&&app.requestFullscreen)app.requestFullscreen().catch(()=>{});else if(!on&&document.fullscreenElement)document.exitFullscreen().catch(()=>{});}catch(e){}
 });
 document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&app.classList.contains('focus'))setFocus(false);else fit();});}
$('chatToggle').addEventListener('click',()=>setDrawer(!$('app').classList.contains('drawer')));
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  if(!$('viewer').hidden){closeViewer();return;}
  if(!$('whatsNew').hidden){$('whatsNew').querySelector('[data-act="wn-ok"]')?.click();return;}
  if(!$('teamPanel').hidden){$('teamPanel').hidden=true;return;}
  if($('app').classList.contains('drawer')){if(document.activeElement&&document.activeElement.closest('.pane'))document.activeElement.blur();setDrawer(false);return;}
  if($('app').classList.contains('focus'))$('fsBtn').click();});
// dialogs take the keyboard focus when they open and give it back when they close; Tab stays inside them
{let opener=null;
 for(const id of ['teamPanel','whatsNew']){const el=$(id);
  new MutationObserver(()=>{
    if(!el.hidden){opener=document.activeElement;setTimeout(()=>{const f=el.querySelector('input,button,select,textarea');f&&f.focus();},0);}
    else if(opener&&document.contains(opener)){opener.focus();opener=null;}
  }).observe(el,{attributes:true,attributeFilter:['hidden']});
  el.addEventListener('keydown',e=>{if(e.key!=='Tab')return;const f=[...el.querySelectorAll('input,button,select,textarea,a[href]')].filter(x=>!x.disabled&&x.offsetParent);if(!f.length)return;
    const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){z.focus();e.preventDefault();}else if(!e.shiftKey&&document.activeElement===z){a.focus();e.preventDefault();}});}}
// the dock scrolls sideways with the mouse wheel and fades at the edge while there is more
{const d=$('dock');const edge=()=>d.classList.toggle('at-end',d.scrollLeft+d.clientWidth>=d.scrollWidth-4);
 d.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)&&d.scrollWidth>d.clientWidth){d.scrollLeft+=e.deltaY;e.preventDefault();}},{passive:false});
 d.addEventListener('scroll',edge,{passive:true});new ResizeObserver(()=>{edge();dockCols();}).observe(d);new MutationObserver(()=>requestAnimationFrame(dockCols)).observe($('app'),{attributes:true,attributeFilter:['class']});setInterval(edge,2000);}
['teamPanel','whatsNew'].forEach(id=>$(id).addEventListener('click',e=>{if(e.target===e.currentTarget){if(id==='whatsNew')$(id).querySelector('[data-act="wn-ok"]')?.click();else $(id).hidden=true;}}));
// tablet portrait: drag the bar above the panel to make the panel taller or shorter (remembered; double tap resets)
{const sp=$('pSplit'),app=$('app');let d=null;
 try{const f=parseFloat(localStorage.getItem('devroom.chath'));if(f>.15&&f<.85)app.style.setProperty('--chath',(f*100).toFixed(1)+'%');}catch(e){}
 const body=()=>document.querySelector('.body').getBoundingClientRect();
 sp.addEventListener('pointerdown',e=>{if(e.button>0)return;d={id:e.pointerId};sp.setPointerCapture(e.pointerId);sp.classList.add('on');e.preventDefault();});
 sp.addEventListener('pointermove',e=>{if(!d||e.pointerId!==d.id)return;const b=body(),dock=document.querySelector('.dockwrap').offsetHeight;
   const h=Math.max(200,Math.min(b.height-dock-170,b.bottom-e.clientY));d.f=h/b.height;app.style.setProperty('--chath',h+'px');});
 const end=e=>{if(!d||e.pointerId!==d.id)return;sp.classList.remove('on');if(d.f){app.style.setProperty('--chath',(d.f*100).toFixed(1)+'%');try{localStorage.setItem('devroom.chath',d.f.toFixed(3));}catch(err){}}d=null;};
 sp.addEventListener('pointerup',end);sp.addEventListener('pointercancel',end);
 sp.addEventListener('dblclick',()=>{app.style.removeProperty('--chath');try{localStorage.removeItem('devroom.chath');}catch(e){}});}
// keep the drawer clear of the session cards
{const dw=document.querySelector('.dockwrap');const upd=()=>{if(dw)$('app').style.setProperty('--dockh',dw.offsetHeight+'px');};if(window.ResizeObserver&&dw)new ResizeObserver(upd).observe(dw);upd();}
